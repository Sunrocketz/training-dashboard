<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контроль штата обучения — дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E9ECF1;
    --border:#E2E5EA; --border-soft:#EDEFF2;
    --text-primary:#1B1E27; --text-secondary:#5B6472; --text-muted:#8E96A3;
    --accent:#4457E8; --accent-soft:#EEF1FE; --accent-dark:#2F3FBF;
    --success:#12876F; --success-soft:#E4F6F1;
    --warning:#B7791F; --warning-soft:#FCF1DE;
    --danger:#C7304C; --danger-soft:#FCE7EB;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --shadow:0 1px 2px rgba(20,24,34,.04), 0 1px 1px rgba(20,24,34,.03);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text-primary); font-family:var(--font-body);
    min-height:100vh; padding:32px 24px 80px;
  }
  .wrap{max-width:1220px; margin:0 auto;}

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:22px; gap:24px; flex-wrap:wrap;
  }
  .title-block h1{
    font-family:var(--font-display); font-weight:600; font-size:26px; letter-spacing:-0.01em;
  }
  .title-block p{color:var(--text-secondary); font-size:14px; margin-top:4px;}
  .status-block{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .status-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
  .status-pill{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary);
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    padding:6px 14px; box-shadow:var(--shadow);
  }
  .data-updated{
    font-size:12px; color:var(--text-muted); text-align:right; max-width:280px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0;}
  .dot.live{background:var(--success); box-shadow:0 0 0 3px var(--success-soft);}
  .dot.error{background:var(--danger); box-shadow:0 0 0 3px var(--danger-soft);}
  .btn{
    font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--text-primary);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 14px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}

  #config{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);
    padding:16px 18px; margin-bottom:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  #config label{font-size:13px; color:var(--text-secondary); white-space:nowrap;}
  #config input[type=text]{
    flex:1; min-width:260px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--text-primary); font-family:var(--font-mono); font-size:13px;
    padding:9px 12px;
  }
  #config input[type=text]:focus{outline:none; border-color:var(--accent);}
  #config .hint{width:100%; font-size:12px; color:var(--text-muted); margin-top:2px;}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:4px; margin-bottom:20px; background:var(--surface-2); border-radius:10px; padding:4px; width:fit-content;}
  .tab-btn{
    font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--text-secondary);
    background:transparent; border:none; border-radius:7px; padding:8px 16px; cursor:pointer;
    transition:all .15s;
  }
  .tab-btn.active{background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .kpi-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:20px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow);}
  .kpi-card .label{font-size:12px; color:var(--text-secondary); margin-bottom:8px;}
  .kpi-card .value{font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-0.01em;}
  .kpi-card .sub{font-size:12px; margin-top:4px; color:var(--text-muted);}
  .kpi-card.accent .value{color:var(--accent);}
  .kpi-card.success .value{color:var(--success);}
  .kpi-card.danger .value{color:var(--danger);}

  .section{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);}
  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .section-head h2{font-family:var(--font-display); font-size:16px; font-weight:600;}
  .section-head .desc{font-size:12px; color:var(--text-muted);}

  .funnel{display:flex; flex-direction:column; gap:10px;}
  .funnel-row{display:flex; align-items:center; gap:14px;}
  .funnel-label{width:150px; font-size:13px; color:var(--text-secondary); flex-shrink:0;}
  .funnel-track{flex:1; height:34px; background:var(--surface-2); border-radius:8px; overflow:hidden;}
  .funnel-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), #7C93FF);
    display:flex; align-items:center; justify-content:flex-end; padding-right:12px;
    border-radius:8px; transition:width .6s ease;
  }
  .funnel-fill span{font-family:var(--font-mono); font-size:13px; font-weight:600; color:#fff;}
  .funnel-drop{width:80px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-muted); flex-shrink:0;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  .three-col{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}

  .table-controls{display:flex; gap:10px; margin-bottom:14px;}
  .table-controls input{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-size:13px; padding:8px 12px;}
  .table-controls input:focus{outline:none; border-color:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); font-weight:500; padding:0 10px 10px; cursor:pointer; white-space:nowrap;}
  thead th:hover{color:var(--text-secondary);}
  tbody td{padding:11px 10px; border-top:1px solid var(--border-soft); font-family:var(--font-mono); white-space:nowrap;}
  tbody td:first-child{font-family:var(--font-body); font-weight:500;}
  tbody tr{cursor:pointer; transition:background .1s;}
  tbody tr:hover{background:var(--accent-soft);}
  .badge{font-size:11px; padding:2px 8px; border-radius:100px; font-family:var(--font-body); font-weight:500; white-space:nowrap;}
  .badge.success{background:var(--success-soft); color:var(--success);}
  .badge.warning{background:var(--warning-soft); color:var(--warning);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}

  .placeholder{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--text-muted); text-align:center; gap:10px;}
  .placeholder .big{font-size:15px; color:var(--text-secondary);}

  /* ---- detail panel ---- */
  #detailOverlay{
    display:none; position:fixed; inset:0; background:rgba(20,24,34,.35); z-index:50;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
  }
  #detailOverlay.open{display:flex;}
  #detailPanel{
    background:var(--surface); border-radius:16px; max-width:820px; width:100%;
    padding:28px 30px; box-shadow:0 20px 60px rgba(20,24,34,.2); animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(12px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
  .detail-head h2{font-family:var(--font-display); font-size:20px; font-weight:600;}
  .detail-head .close-btn{background:var(--surface-2); border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:16px; color:var(--text-secondary);}
  .detail-head .close-btn:hover{background:var(--surface-3);}
  .mini-kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  .mini-kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .detail-actions{display:flex; gap:8px; align-items:center;}
  .mini-kpi{background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .mini-kpi .label{font-size:11px; color:var(--text-muted);}
  .mini-kpi .value{font-family:var(--font-display); font-size:19px; font-weight:600; margin-top:2px;}
  .compare-row{display:flex; align-items:center; gap:8px; font-size:12px; margin-top:2px;}
  .compare-row.up{color:var(--success);} .compare-row.down{color:var(--danger);}

  /* ---- month cards ---- */
  .month-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .month-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px;
    cursor:pointer; transition:box-shadow .15s, border-color .15s; box-shadow:var(--shadow);
  }
  .month-card:hover{border-color:var(--accent); box-shadow:0 4px 14px rgba(68,87,232,.12);}
  .month-card h3{font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:10px;}
  .month-card .row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:4px;}
  .month-card .row b{color:var(--text-primary); font-family:var(--font-mono);}

  .toolbar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow);
  }
  .toolbar-left, .toolbar-right{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .toolbar label{font-size:13px; color:var(--text-secondary);}
  .toolbar select{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text-primary); font-size:13px; padding:8px 12px; min-width:180px;
  }
  .toolbar select:focus{outline:none; border-color:var(--accent);}
  .legend-bar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; font-size:12px; color:var(--text-secondary);}
  .kpi-card .delta{font-size:12px; margin-top:6px; font-family:var(--font-mono);}
  .kpi-card .delta.up{color:var(--success);}
  .kpi-card .delta.down{color:var(--danger);}
  .kpi-card .delta.flat{color:var(--text-muted);}
  .dropout-table{width:100%; border-collapse:collapse; font-size:13px;}
  .dropout-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); font-weight:500; padding:0 10px 10px;}
  .dropout-table td{padding:10px; border-top:1px solid var(--border-soft); font-family:var(--font-mono);}
  .dropout-table td:first-child{font-family:var(--font-body); font-weight:500;}

  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .two-col, .three-col{grid-template-columns:1fr;}
    .mini-kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Контроль штата обучения</h1>
      <p>Воронка конверсии, отсев и результаты по тренерам и месяцам</p>
    </div>
    <div class="status-block">
      <div class="status-pill">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Не подключено</span>
      </div>
      <div class="data-updated" id="dataUpdatedLabel">Данные API: —</div>
      <div class="status-actions">
        <button class="btn" id="exportCsvBtn" type="button" style="display:none;">Экспорт CSV</button>
        <button class="btn" id="refreshBtn" type="button">Обновить</button>
      </div>
    </div>
  </header>

  <div id="config">
    <label for="urlInput">Ссылка на веб-сервис (Apps Script /exec)</label>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="btn primary" id="connectBtn">Подключить</button>
    <div class="hint">Впиши ссылку и нажми «Подключить». Автообновление — раз в сутки, в 08:00 по Москве.</div>
    <div class="hint" id="nextRefreshLabel"></div>
  </div>

  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab-btn active" data-tab="overview">Обзор</button>
    <button class="tab-btn" data-tab="trainers">По тренерам</button>
    <button class="tab-btn" data-tab="months">По месяцам</button>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="toolbar-left">
      <label for="periodSelect">Период</label>
      <select id="periodSelect" aria-label="Фильтр по месяцу">
        <option value="">Все месяцы</option>
      </select>
      <span id="periodHint" style="font-size:12px;color:var(--text-muted);"></span>
    </div>
    <div class="toolbar-right legend-bar" id="badgeLegend"></div>
  </div>

  <div id="content">
    <div class="placeholder">
      <div class="big">Загрузка данных…</div>
      <div>Идёт запрос к веб-сервису Apps Script. Если долго не отвечает — нажми «Обновить».</div>
    </div>
  </div>
</div>

<div id="detailOverlay">
  <div id="detailPanel"></div>
</div>

<script>
const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCpZCfhcuynPp0431uiLZactRUvv51as0hdNfTtkHKF69eN1SD_7aBfqNjs7MKzbt9Fw/exec';

let dashboardData = null;
let viewData = null;
let periodMonth = '';
let refreshTimeout = null, refreshInterval = null;
let trainerSortState = { key: 'conv1to5Weighted', dir: 'desc' };
let tabsInited = false;
let pendingDeepLink = null;
let deepLinkApplied = false;
const DAY_MS = 24*60*60*1000;
const el = (id) => document.getElementById(id);
let charts = {};

const DEFAULT_METRICS = { badgeLow: 20, badgeHigh: 30, planConv1to5: 30 };

function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function metrics(){ return Object.assign({}, DEFAULT_METRICS, (dashboardData && dashboardData.metrics) || {}); }
function round1(n){ return Math.round(n * 10) / 10; }
function pct(part, whole){ return whole ? round1((part/whole)*100) : 0; }
function sumField(rows, key){ return rows.reduce((s,r)=>s+(Number(r[key])||0), 0); }

function getNextRefreshTime(){
  const now = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 5,0,0));
  if(next.getTime() <= now.getTime()) next.setUTCDate(next.getUTCDate()+1);
  return next;
}
function updateNextRefreshLabel(nextDate){
  const label = el('nextRefreshLabel'); if(!label) return;
  label.textContent = 'Следующее автообновление: ' + nextDate.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit', timeZone:'Europe/Moscow'}) + ' МСК';
}
function startAutoRefresh(url){
  if(refreshTimeout) clearTimeout(refreshTimeout);
  if(refreshInterval) clearInterval(refreshInterval);
  const next = getNextRefreshTime();
  updateNextRefreshLabel(next);
  refreshTimeout = setTimeout(() => {
    fetchData(url);
    updateNextRefreshLabel(getNextRefreshTime());
    refreshInterval = setInterval(() => { fetchData(url); updateNextRefreshLabel(getNextRefreshTime()); }, DAY_MS);
  }, next.getTime() - Date.now());
}

function setStatus(state, text){
  const dot = el('statusDot');
  dot.className = 'dot' + (state==='live' ? ' live' : state==='error' ? ' error' : '');
  el('statusText').textContent = text;
}

function pctBadgeClass(value){
  const m = metrics();
  if(value===null||value===undefined) return '';
  if(value>=m.badgeHigh) return 'success';
  if(value>=m.badgeLow) return 'warning';
  return 'danger';
}

function renderBadgeLegend(){
  const m = metrics();
  el('badgeLegend').innerHTML = `
    <span>Конв. 1→5:</span>
    <span class="badge success">≥${m.badgeHigh}% хорошо</span>
    <span class="badge warning">${m.badgeLow}–${m.badgeHigh-0.1}% средне</span>
    <span class="badge danger"><${m.badgeLow}% низко</span>
    <span style="color:var(--text-muted);">план ${m.planConv1to5}%</span>
  `;
}

function aggregateFromGroups(groups, raw){
  const day1 = sumField(groups,'day1');
  const day2Start = sumField(groups,'day2Start');
  const day3Start = sumField(groups,'day3Start');
  const leftSelf = sumField(groups,'leftSelf');
  const refused = sumField(groups,'refused');
  const transferred = sumField(groups,'transferred');
  const finalCount = sumField(groups,'finalCount');

  const byTrainerMap = {};
  groups.forEach(g=>{
    if(!byTrainerMap[g.trainer]){
      byTrainerMap[g.trainer] = {
        name:g.trainer, groups:0, day1:0, leftSelf:0, refused:0, transferred:0, finalCount:0,
        conv1to5Sum:0, conv1to5Count:0, conv2Sum:0, conv2Count:0, conv3Sum:0, conv3Count:0
      };
    }
    const t = byTrainerMap[g.trainer];
    t.groups += 1;
    t.day1 += g.day1; t.leftSelf += g.leftSelf; t.refused += g.refused;
    t.transferred += g.transferred; t.finalCount += g.finalCount;
    if(g.conv1to5!==null && g.conv1to5!==undefined){ t.conv1to5Sum += g.conv1to5; t.conv1to5Count += 1; }
    if(g.conv2!==null && g.conv2!==undefined){ t.conv2Sum += g.conv2; t.conv2Count += 1; }
    if(g.conv3!==null && g.conv3!==undefined){ t.conv3Sum += g.conv3; t.conv3Count += 1; }
  });
  const byTrainer = Object.values(byTrainerMap).sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(t=>({
    name:t.name, groups:t.groups, day1:t.day1, leftSelf:t.leftSelf, refused:t.refused,
    transferred:t.transferred, finalCount:t.finalCount,
    conv1to5: t.conv1to5Count>0 ? round1(t.conv1to5Sum/t.conv1to5Count) : null,
    conv1to5Weighted: t.day1>0 ? round1(t.finalCount/t.day1*100) : null,
    conv2: t.conv2Count>0 ? round1(t.conv2Sum/t.conv2Count) : null,
    conv3: t.conv3Count>0 ? round1(t.conv3Sum/t.conv3Count) : null
  }));

  const monthOrder = [];
  const byMonthMap = {};
  groups.forEach(g=>{
    if(!byMonthMap[g.month]){
      byMonthMap[g.month] = {month:g.month, groups:0, day1:0, finalCount:0, leftSelf:0, refused:0, transferred:0};
      monthOrder.push(g.month);
    }
    const m = byMonthMap[g.month];
    m.groups += 1; m.day1 += g.day1; m.finalCount += g.finalCount;
    m.leftSelf += g.leftSelf; m.refused += g.refused; m.transferred += g.transferred;
  });
  const byMonth = monthOrder.map(key=>{
    const m = byMonthMap[key];
    return {
      ...m,
      conv1to5: m.day1>0 ? round1(m.finalCount/m.day1*100) : null
    };
  });

  return {
    schemaVersion: raw.schemaVersion,
    updatedAt: raw.updatedAt,
    metrics: raw.metrics,
    periodFiltered: true,
    totals: {
      groups: groups.length,
      notGathered: null,
      fellApart: null,
      day1, day2Start, day3Start, leftSelf, refused, transferred, finalCount,
      conv1to5: day1>0 ? round1(finalCount/day1*100) : 0
    },
    funnel: [
      {label:'1-й день', value: day1},
      {label:'2-й день', value: day2Start},
      {label:'3-й день', value: day3Start},
      {label:'Выход на линию', value: finalCount}
    ],
    byTrainer,
    byMonth,
    groups,
    allByMonth: raw.byMonth || []
  };
}

function buildViewData(raw, month){
  if(!month){
    return Object.assign({}, raw, {
      periodFiltered: false,
      allByMonth: raw.byMonth || [],
      byTrainer: (raw.byTrainer||[]).map(t=>({
        ...t,
        conv1to5Weighted: t.conv1to5Weighted!=null ? t.conv1to5Weighted
          : (t.day1>0 ? round1(t.finalCount/t.day1*100) : null)
      })),
      byMonth: (raw.byMonth||[]).map(m=>({
        ...m,
        day1: m.day1!=null ? m.day1 : null,
        leftSelf: m.leftSelf!=null ? m.leftSelf : 0,
        refused: m.refused!=null ? m.refused : 0,
        transferred: m.transferred!=null ? m.transferred : 0,
        finalCount: m.finalCount!=null ? m.finalCount : null
      }))
    });
  }
  const groups = (raw.groups||[]).filter(g=>g.month===month);
  return aggregateFromGroups(groups, raw);
}

function momContext(raw, month){
  const months = raw.byMonth || [];
  if(!months.length) return null;
  let idx;
  if(month){
    idx = months.findIndex(m=>m.month===month);
  } else {
    idx = months.length - 1;
  }
  if(idx < 0) return null;
  const current = months[idx];
  const prev = idx > 0 ? months[idx-1] : null;
  return { current, prev, label: prev ? `к ${prev.month}` : null };
}

function deltaHtml(current, previous, opts={}){
  if(previous==null || current==null || Number.isNaN(current) || Number.isNaN(previous)){
    return `<div class="delta flat">нет базы для сравнения</div>`;
  }
  const diff = round1(current - previous);
  const invert = !!opts.invert;
  const good = invert ? diff <= 0 : diff >= 0;
  const cls = diff === 0 ? 'flat' : (good ? 'up' : 'down');
  const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '•';
  const unit = opts.unit || '';
  const label = opts.label || '';
  return `<div class="delta ${cls}">${arrow} ${diff>0?'+':''}${diff}${unit} ${label}</div>`;
}

function fillPeriodSelect(raw){
  const select = el('periodSelect');
  const current = periodMonth;
  const months = raw.byMonth || [];
  select.innerHTML = `<option value="">Все месяцы</option>` + months.map(m=>
    `<option value="${m.month}">${m.month}</option>`
  ).join('');
  select.value = current;
  if(select.value !== current) periodMonth = '';
}

function readDeepLinkFromUrl(){
  const p = new URLSearchParams(location.search);
  return {
    period: p.get('period') || '',
    trainer: p.get('trainer') || '',
    month: p.get('month') || '',
    tab: p.get('tab') || ''
  };
}

function syncUrl(extra={}){
  const p = new URLSearchParams();
  const period = extra.period !== undefined ? extra.period : periodMonth;
  const tabBtn = document.querySelector('.tab-btn.active');
  const tab = extra.tab !== undefined ? extra.tab : (tabBtn ? tabBtn.dataset.tab : '');
  if(period) p.set('period', period);
  if(tab && tab !== 'overview') p.set('tab', tab);
  if(extra.trainer) p.set('trainer', extra.trainer);
  if(extra.month) p.set('month', extra.month);
  const qs = p.toString();
  const next = qs ? `${location.pathname}?${qs}` : location.pathname;
  history.replaceState(null, '', next);
}

function formatDataUpdated(iso){
  if(!iso) return 'Данные API: —';
  try{
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return 'Данные API: ' + iso;
    return 'Данные API: ' + d.toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }catch(_){
    return 'Данные API: ' + iso;
  }
}

function csvEscape(v){
  const s = v==null ? '' : String(v);
  if(/[;"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCsv(filename, rows){
  const body = rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+body], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function activateTab(tab){
  if(!tab) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+tab));
}

function hasDeepLinkIntent(link){
  return !!(link && (link.period || link.trainer || link.month || link.tab));
}

function applyPendingDeepLink(){
  if(deepLinkApplied || !hasDeepLinkIntent(pendingDeepLink) || !dashboardData) return;
  const link = pendingDeepLink;
  deepLinkApplied = true;
  if(link.period){
    const exists = (dashboardData.byMonth||[]).some(m=>m.month===link.period);
    if(exists) periodMonth = link.period;
  }
  viewData = buildViewData(dashboardData, periodMonth);
  fillPeriodSelect(dashboardData);
  renderOverview(viewData);
  renderTrainersTab(viewData);
  renderMonthsTab(viewData);
  const tab = link.tab || (link.trainer ? 'trainers' : link.month ? 'months' : 'overview');
  activateTab(tab);
  initTabsOnce();
  syncUrl({ period: periodMonth, tab, trainer: link.trainer || '', month: link.month || '' });
  if(link.trainer){
    const found = viewData.byTrainer.find(t=>t.name===link.trainer)
      || viewData.byTrainer.find(t=>t.name.toLowerCase()===link.trainer.toLowerCase());
    if(found) openTrainerDetail(found.name, {skipUrl:true});
  } else if(link.month){
    const exists = (dashboardData.byMonth||[]).some(m=>m.month===link.month);
    if(exists) openMonthDetail(link.month, {skipUrl:true});
  }
}

function renderAll(){
  if(!dashboardData) return;
  viewData = buildViewData(dashboardData, periodMonth);
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'overview';
  el('tabs').style.display = 'flex';
  el('toolbar').style.display = 'flex';

  renderBadgeLegend();
  el('dataUpdatedLabel').textContent = formatDataUpdated(dashboardData.updatedAt);
  const hint = el('periodHint');
  if(periodMonth){
    hint.textContent = `Показаны valid-группы за «${periodMonth}». «Не собралась/распалась» в фильтре недоступны.`;

    hint.textContent = 'Сравнение KPI — последний месяц к предыдущему.';
  }

  renderMonthsTab(viewData);
  activateTab(activeTab);
  initTabsOnce();
  if(!deepLinkApplied && hasDeepLinkIntent(pendingDeepLink)) applyPendingDeepLink();

}

async function fetchData(url){
  setStatus('', 'Загрузка...');
  el('dataUpdatedLabel').textContent = 'Данные API: загрузка…';
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(!data || !data.totals) throw new Error('Некорректный JSON API');
    dashboardData = data;
    try{
      renderAll();
    }catch(renderErr){
      console.error('renderAll failed', renderErr);
      throw new Error('Данные получены, но отрисовка упала: ' + (renderErr && renderErr.message ? renderErr.message : renderErr));
    }
    setStatus('live', 'Обновлено в ' + new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }catch(err){
    console.error('fetchData failed', err);
    setStatus('error', 'Ошибка подключения');
    el('dataUpdatedLabel').textContent = 'Данные API: ошибка';
    el('config').style.display = '';
    if(!dashboardData){
      el('content').innerHTML = '<div class="placeholder"><div class="big">Не удалось получить данные</div><div>Проверь ссылку `/exec`, доступ веб-приложения и консоль браузера (F12).</div><div style="margin-top:8px;color:var(--text-muted);font-size:12px;">'+String(err && err.message ? err.message : err)+'</div></div>';
    }
  }
}

function initTabsOnce(){
  if(tabsInited) return;

  document.querySelectorAll('.tab-btn').forEach(btn => {

function renderFunnelInto(elId, funnel){
  const max = (funnel[0] && funnel[0].value) || 1;
  let html = '';
  funnel.forEach((step,i)=>{
    const widthPct = Math.max(6, Math.round((step.value/max)*100));
    let dropText='';
    if(i>0){ const prev=funnel[i-1].value; const drop = prev>0 ? round1((1-step.value/prev)*100) : 0; dropText='−'+drop+'%'; }
    html += `<div class="funnel-row"><div class="funnel-label">${step.label}</div><div class="funnel-track"><div class="funnel-fill" style="width:${widthPct}%"><span>${step.value}</span></div></div><div class="funnel-drop">${dropText}</div></div>`;
  });
  el(elId).innerHTML = html;
}

function renderTrainerTable(data){
  let trainers = [...data.byTrainer];
  const search = (el('trainerSearch') && el('trainerSearch').value.toLowerCase()) || '';
  if(search) trainers = trainers.filter(t=>t.name.toLowerCase().includes(search));
  trainers.sort((a,b)=>{
    let av=a[trainerSortState.key], bv=b[trainerSortState.key];
    if(av===null||av===undefined) av=-1; if(bv===null||bv===undefined) bv=-1;
    if(typeof av==='string') return trainerSortState.dir==='asc'? av.localeCompare(bv,'ru'): bv.localeCompare(av,'ru');
    return trainerSortState.dir==='asc'? av-bv : bv-av;
  });
  const cols = [
    ['name','Тренер'],['groups','Групп'],['day1','1-й день'],
    ['leftSelf','Ушли сами'],['refused','Отказали'],['transferred','Перенесли'],['finalCount','Итог'],
    ['conv1to5Weighted','Конв. взвеш.'],['conv1to5','Конв. ср.%'],['conv2','Конв. 2→5'],['conv3','Конв. 3→5']
  ];
  el('trainerHeadRow').innerHTML = cols.map(([key,label])=>{
    const arrow = trainerSortState.key===key ? (trainerSortState.dir==='asc'?' ↑':' ↓') : '';
    return `<th data-key="${key}">${label}${arrow}</th>`;
  }).join('');
  el('trainerBody').innerHTML = trainers.map(t=>`
    <tr data-trainer="${t.name}">
      <td>${t.name}</td><td>${t.groups}</td><td>${t.day1}</td><td>${t.leftSelf}</td><td>${t.refused}</td><td>${t.transferred}</td><td>${t.finalCount}</td>
      <td><span class="badge ${pctBadgeClass(t.conv1to5Weighted)}">${t.conv1to5Weighted!=null?t.conv1to5Weighted+'%':'—'}</span></td>
      <td>${t.conv1to5!=null?t.conv1to5+'%':'—'}</td>
      <td>${t.conv2!=null?t.conv2+'%':'—'}</td><td>${t.conv3!=null?t.conv3+'%':'—'}</td>
    </tr>`).join('');
  document.querySelectorAll('#trainerHeadRow th').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(trainerSortState.key===key) trainerSortState.dir = trainerSortState.dir==='asc'?'desc':'asc';
    else { trainerSortState.key=key; trainerSortState.dir='desc'; }
    renderTrainerTable(viewData);
  }));
  document.querySelectorAll('#trainerBody tr').forEach(tr=>tr.addEventListener('click', ()=>openTrainerDetail(tr.dataset.trainer)));
}

function openTrainerDetail(name, opts={}){
  const data = viewData;
  const trainer = data.byTrainer.find(t=>t.name===name);
  if(!trainer) return;
  const groups = data.groups.filter(g=>g.trainer===name);
  const overallConv = data.totals.conv1to5;
  const tw = trainerConv(trainer);
  const diff = tw!==null ? round1(tw-overallConv) : null;

  const byMonth = {};
  groups.forEach(g=>{
    if(!byMonth[g.month]) byMonth[g.month] = {month:g.month, day1:0, finalCount:0, groups:0, leftSelf:0, refused:0, transferred:0};
    byMonth[g.month].day1 += g.day1; byMonth[g.month].finalCount += g.finalCount; byMonth[g.month].groups += 1;
    byMonth[g.month].leftSelf += g.leftSelf; byMonth[g.month].refused += g.refused; byMonth[g.month].transferred += g.transferred;
  });
  const monthTrend = Object.values(byMonth).map(m=>({month:m.month, conv1to5: m.day1>0? round1(m.finalCount/m.day1*100) : null, ...m}));

  const funnel = [
    {label:'1-й день', value: groups.reduce((s,g)=>s+g.day1,0)},
    {label:'2-й день', value: groups.reduce((s,g)=>s+g.day2Start,0)},
    {label:'3-й день', value: groups.reduce((s,g)=>s+g.day3Start,0)},
    {label:'Выход на линию', value: groups.reduce((s,g)=>s+g.finalCount,0)}
  ];

  el('detailPanel').innerHTML = `
    <div class="detail-head">
      <h2>${name}</h2>
      <div class="detail-actions">
        <button class="btn" id="copyTrainerLink" type="button">Ссылка</button>
        <button class="close-btn" id="closeDetail" type="button">✕</button>
      </div>
    </div>
    <div class="mini-kpi-grid">
      <div class="mini-kpi"><div class="label">Групп проведено</div><div class="value">${trainer.groups}</div></div>
      <div class="mini-kpi"><div class="label">Конв. взвеш. 1→5</div><div class="value">${tw!=null?tw+'%':'—'}</div>
        ${diff!==null ? `<div class="compare-row ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff)}% к периоду</div>` : ''}
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">ср.% групп: ${trainer.conv1to5!=null?trainer.conv1to5+'%':'—'}</div>
      </div>
      <div class="mini-kpi"><div class="label">1-й день → выход</div><div class="value">${trainer.day1} → ${trainer.finalCount}</div></div>
      <div class="mini-kpi"><div class="label">Ушли сами</div><div class="value">${trainer.leftSelf}</div></div>
    </div>
    <div class="mini-kpi-grid cols-3" style="margin-top:-8px;">
      <div class="mini-kpi"><div class="label">Отказали / перенесли</div><div class="value">${trainer.refused} / ${trainer.transferred}</div></div>
      <div class="mini-kpi"><div class="label">Конв. 2→5</div><div class="value">${trainer.conv2!=null?trainer.conv2+'%':'—'}</div></div>
      <div class="mini-kpi"><div class="label">Конв. 3→5</div><div class="value">${trainer.conv3!=null?trainer.conv3+'%':'—'}</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin:-6px 0 14px;">В карточке — все агрегаты API по valid-группам тренера${periodMonth?` за «${periodMonth}»`:''}. «Не собралась/распалась» по тренеру в API нет.</div>
    <div class="section-head"><h2>Воронка тренера</h2></div>
    <div class="funnel" id="trainerFunnel" style="margin-bottom:22px;"></div>
    <div class="section-head"><h2>Динамика и отсев по месяцам</h2></div>
    <div style="position:relative;height:180px;margin-bottom:12px;"><canvas id="trainerTrendChart"></canvas></div>
    <table class="dropout-table">
      <thead><tr><th>Месяц</th><th>Групп</th><th>1-й день</th><th>Итог</th><th>Ушли</th><th>Отказали</th><th>Перенесли</th><th>Конв.</th></tr></thead>
      <tbody>
        ${monthTrend.map(m=>`<tr>
          <td>${m.month}</td><td>${m.groups}</td><td>${m.day1}</td><td>${m.finalCount}</td><td>${m.leftSelf}</td><td>${m.refused}</td><td>${m.transferred}</td>
          <td><span class="badge ${pctBadgeClass(m.conv1to5)}">${m.conv1to5!=null?m.conv1to5+'%':'—'}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  renderFunnelInto('trainerFunnel', funnel);
  destroyChart('trainerTrendChart');
  const ctx = document.getElementById('trainerTrendChart');
  if(ctx && typeof Chart!=='undefined') charts['trainerTrendChart'] = new Chart(ctx, {
    type:'bar',
    data:{ labels: monthTrend.map(m=>m.month), datasets:[{ label:'Конверсия 1→5', data: monthTrend.map(m=>m.conv1to5), backgroundColor:'#4457E8', borderRadius:5 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ticks:{color:'#8E96A3', callback:v=>v+'%'}, grid:{color:'#EDEFF2'}}, x:{ticks:{color:'#8E96A3'}, grid:{display:false}} } }
  });
  el('detailOverlay').classList.add('open');
  el('closeDetail').addEventListener('click', closeDetail);
  el('copyTrainerLink').addEventListener('click', async ()=>{
    syncUrl({ trainer: name, tab: 'trainers', month: '' });
    try{
      await navigator.clipboard.writeText(location.href);
      el('copyTrainerLink').textContent = 'Скопировано';
      setTimeout(()=>{ if(el('copyTrainerLink')) el('copyTrainerLink').textContent = 'Ссылка'; }, 1500);
    }catch(_){
      prompt('Скопируй ссылку:', location.href);
    }
  });
  if(!opts.skipUrl) syncUrl({ trainer: name, tab: 'trainers', month: '' });
}

function closeDetail(){
  el('detailOverlay').classList.remove('open');
  destroyChart('trainerTrendChart');
  const tab = document.querySelector('.tab-btn.active')?.dataset.tab || 'overview';
  syncUrl({ tab, trainer: '', month: '' });
}
el('detailOverlay').addEventListener('click', (e)=>{ if(e.target.id==='detailOverlay') closeDetail(); });

function renderMonthsTab(data){
  const months = data.periodFiltered ? data.byMonth : (dashboardData.byMonth || []);
  let html = `<div id="panel-months" class="tab-panel">
    <div class="section"><div class="section-head"><h2>Месяцы обучения</h2><div class="desc">клик по карточке — подробности · показан отсев</div></div>
    <div class="month-grid" id="monthGrid"></div></div>
  </div>`;
  el('content').insertAdjacentHTML('beforeend', html);
  el('monthGrid').innerHTML = months.map(m=>`
    <div class="month-card" data-month="${m.month}">
      <h3>${m.month}</h3>
      <div class="row"><span>Групп</span><b>${m.groups}</b></div>
      <div class="row"><span>Конв. 1→5</span><b>${m.conv1to5!==null&&m.conv1to5!==undefined?m.conv1to5+'%':'—'}</b></div>
      <div class="row"><span>Ушли сами</span><b>${m.leftSelf!=null?m.leftSelf:'—'}</b></div>
      <div class="row"><span>Отказали</span><b>${m.refused!=null?m.refused:'—'}</b></div>
      <div class="row"><span>Перенесли</span><b>${m.transferred!=null?m.transferred:'—'}</b></div>
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;">Нет данных</div>';
  document.querySelectorAll('.month-card').forEach(c=>c.addEventListener('click', ()=>openMonthDetail(c.dataset.month)));
}

function openMonthDetail(month, opts={}){
  const sourceGroups = dashboardData.groups || [];
  const groups = sourceGroups.filter(g=>g.month===month);
  const day1 = groups.reduce((s,g)=>s+g.day1,0);
  const day2 = groups.reduce((s,g)=>s+g.day2Start,0);
  const day3 = groups.reduce((s,g)=>s+g.day3Start,0);
  const final = groups.reduce((s,g)=>s+g.finalCount,0);
  const leftSelf = groups.reduce((s,g)=>s+g.leftSelf,0);
  const refused = groups.reduce((s,g)=>s+g.refused,0);
  const transferred = groups.reduce((s,g)=>s+g.transferred,0);
  const conv = day1>0 ? round1(final/day1*100) : 0;
  const months = dashboardData.byMonth || [];
  const idx = months.findIndex(m=>m.month===month);
  const prev = idx>0 ? months[idx-1] : null;

  const byTrainer = {};
  groups.forEach(g=>{
    if(!byTrainer[g.trainer]) byTrainer[g.trainer] = {name:g.trainer, day1:0, finalCount:0, groups:0, leftSelf:0, refused:0, transferred:0};
    byTrainer[g.trainer].day1 += g.day1; byTrainer[g.trainer].finalCount += g.finalCount; byTrainer[g.trainer].groups += 1;
    byTrainer[g.trainer].leftSelf += g.leftSelf; byTrainer[g.trainer].refused += g.refused; byTrainer[g.trainer].transferred += g.transferred;
  });
  const trainerRows = Object.values(byTrainer).map(t=>({...t, conv: t.day1>0? round1(t.finalCount/t.day1*100) : null}))
    .sort((a,b)=>(b.conv||0)-(a.conv||0));

  el('detailPanel').innerHTML = `
    <div class="detail-head">
      <h2>${month}</h2>
      <div class="detail-actions">
        <button class="btn" id="copyMonthLink" type="button">Ссылка</button>
        <button class="close-btn" id="closeDetail" type="button">✕</button>
      </div>
    </div>
    <div class="mini-kpi-grid">
      <div class="mini-kpi"><div class="label">Групп</div><div class="value">${groups.length}</div>
        ${prev?`<div class="compare-row ${groups.length-prev.groups>=0?'up':'down'}">${groups.length-prev.groups>=0?'▲':'▼'} ${Math.abs(groups.length-prev.groups)} к ${prev.month}</div>`:''}
      </div>
      <div class="mini-kpi"><div class="label">Конв. 1→5</div><div class="value">${conv}%</div>
        ${prev&&prev.conv1to5!=null?`<div class="compare-row ${conv-prev.conv1to5>=0?'up':'down'}">${conv-prev.conv1to5>=0?'▲':'▼'} ${Math.abs(round1(conv-prev.conv1to5))}% к ${prev.month}</div>`:''}
      </div>
      <div class="mini-kpi"><div class="label">Ушли сами</div><div class="value">${leftSelf}</div></div>
      <div class="mini-kpi"><div class="label">Отказали / перенесли</div><div class="value">${refused} / ${transferred}</div></div>
    </div>
    <div class="section-head"><h2>Воронка месяца</h2></div>
    <div class="funnel" id="monthFunnel" style="margin-bottom:22px;"></div>
    <div class="section-head"><h2>Тренеры в этом месяце</h2></div>
    <div style="max-height:280px;overflow-y:auto;">
      <table class="dropout-table">
        <thead><tr><th>Тренер</th><th>Гр.</th><th>Ушли</th><th>Отказали</th><th>Перенесли</th><th>Конв.</th></tr></thead>
        <tbody>
          ${trainerRows.map(t=>`<tr>
            <td>${t.name}</td><td>${t.groups}</td><td>${t.leftSelf}</td><td>${t.refused}</td><td>${t.transferred}</td>
            <td><span class="badge ${pctBadgeClass(t.conv)}">${t.conv!=null?t.conv+'%':'—'}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  renderFunnelInto('monthFunnel', [
    {label:'1-й день', value: day1}, {label:'2-й день', value: day2}, {label:'3-й день', value: day3}, {label:'Выход на линию', value: final}
  ]);
  el('detailOverlay').classList.add('open');
  el('closeDetail').addEventListener('click', closeDetail);
  el('copyMonthLink').addEventListener('click', async ()=>{
    syncUrl({ month, tab: 'months', trainer: '' });
    try{
      await navigator.clipboard.writeText(location.href);
      el('copyMonthLink').textContent = 'Скопировано';
      setTimeout(()=>{ if(el('copyMonthLink')) el('copyMonthLink').textContent = 'Ссылка'; }, 1500);
    }catch(_){
      prompt('Скопируй ссылку:', location.href);
    }
  });
  if(!opts.skipUrl) syncUrl({ month, tab: 'months', trainer: '' });
}
</script>
</body>
</html>
