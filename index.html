<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контроль штата обучения — дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E9ECF1;
    --border:#E2E5EA; --border-soft:#EDEFF2;
    --text-primary:#1B1E27; --text-secondary:#5B6472; --text-muted:#8E96A3;
    --accent:#4457E8; --accent-soft:#EEF1FE; --accent-dark:#2F3FBF;
    --success:#12876F; --success-soft:#E4F6F1;
    --warning:#B7791F; --warning-soft:#FCF1DE;
    --danger:#C7304C; --danger-soft:#FCE7EB;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --shadow:0 1px 2px rgba(20,24,34,.04), 0 1px 1px rgba(20,24,34,.03);
    /* иерархия: hero → title → body → meta → overline */
    --fs-hero:30px; --fs-title:18px; --fs-kpi:28px; --fs-body:14px; --fs-meta:12px; --fs-overline:11px;
    --lh-tight:1.2; --lh-body:1.45;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text-primary); font-family:var(--font-body);
    font-size:var(--fs-body); line-height:var(--lh-body);
    min-height:100vh; padding:32px 24px 80px;
  }
  .wrap{max-width:1220px; margin:0 auto;}

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:20px; gap:24px; flex-wrap:wrap;
  }
  .title-block h1{
    font-family:var(--font-display); font-weight:700; font-size:var(--fs-hero);
    letter-spacing:-0.02em; line-height:var(--lh-tight);
  }
  .title-block p{
    color:var(--text-secondary); font-size:var(--fs-body); margin-top:6px; max-width:520px;
  }
  .status-block{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .status-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end;}
  .status-pill{
    display:flex; align-items:center; gap:8px; font-size:var(--fs-meta); font-weight:500;
    color:var(--text-secondary);
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    padding:6px 14px; box-shadow:var(--shadow);
  }
  .data-updated{
    font-size:var(--fs-meta); color:var(--text-muted); text-align:right; max-width:300px; line-height:1.35;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-muted); flex-shrink:0;}
  .dot.live{background:var(--success); box-shadow:0 0 0 3px var(--success-soft);}
  .dot.error{background:var(--danger); box-shadow:0 0 0 3px var(--danger-soft);}
  .btn{
    font-family:var(--font-body); font-size:var(--fs-meta); font-weight:600; color:var(--text-primary);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}

  #config{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);
    padding:16px 18px; margin-bottom:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  #config label{font-size:13px; color:var(--text-secondary); white-space:nowrap;}
  #config input[type=text]{
    flex:1; min-width:260px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; color:var(--text-primary); font-family:var(--font-mono); font-size:13px;
    padding:9px 12px;
  }
  #config input[type=text]:focus{outline:none; border-color:var(--accent);}
  #config .hint{width:100%; font-size:12px; color:var(--text-muted); margin-top:2px;}

  /* ---- tabs ---- */
  .tabs{display:flex; gap:4px; margin-bottom:20px; background:var(--surface-2); border-radius:10px; padding:4px; width:fit-content;}
  .tab-btn{
    font-family:var(--font-body); font-size:var(--fs-meta); font-weight:600; color:var(--text-secondary);
    background:transparent; border:none; border-radius:7px; padding:8px 16px; cursor:pointer;
    transition:all .15s;
  }
  .tab-btn.active{background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .context-banner{
    display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-start; justify-content:space-between;
    background:linear-gradient(180deg, #FFFFFF 0%, var(--accent-soft) 140%);
    border:1px solid #D8DFFB; border-radius:14px; padding:14px 18px; margin-bottom:16px;
  }
  .context-banner .eyebrow{
    font-size:var(--fs-overline); font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent-dark); margin-bottom:4px;
  }
  .context-banner .headline{
    font-family:var(--font-display); font-size:var(--fs-title); font-weight:700;
    letter-spacing:-0.015em; line-height:var(--lh-tight); color:var(--text-primary);
  }
  .context-banner .support{
    margin-top:4px; font-size:var(--fs-meta); color:var(--text-secondary); max-width:720px; line-height:1.4;
  }
  .context-banner .side-note{
    font-size:var(--fs-meta); color:var(--text-muted); max-width:260px; text-align:right; line-height:1.4;
  }

  .kpi-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:20px;}
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:2px; min-height:148px;
  }
  .kpi-card .scope{
    font-size:var(--fs-overline); font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:2px;
  }
  .kpi-card .label{
    font-size:var(--fs-meta); font-weight:600; color:var(--text-secondary);
    margin-bottom:6px; line-height:1.3;
  }
  .kpi-card .value{
    font-family:var(--font-display); font-size:var(--fs-kpi); font-weight:700;
    letter-spacing:-0.02em; line-height:1.1; color:var(--text-primary);
  }
  .kpi-card .sub{font-size:var(--fs-meta); margin-top:4px; color:var(--text-muted); line-height:1.35;}
  .kpi-card.accent .value{color:var(--accent);}
  .kpi-card.success .value{color:var(--success);}
  .kpi-card.danger .value{color:var(--danger);}
  .kpi-card.warning .value{color:var(--warning);}
  .kpi-card .delta{
    margin-top:auto; padding-top:8px; border-top:1px solid var(--border-soft);
    font-size:11px; font-family:var(--font-body); font-weight:600; line-height:1.35;
  }
  .kpi-card .delta .delta-main{font-family:var(--font-mono); font-size:12px;}
  .kpi-card .delta .delta-note{display:block; font-weight:500; color:var(--text-muted); margin-top:2px;}

  .section{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow);}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .section-head h2{
    font-family:var(--font-display); font-size:var(--fs-title); font-weight:700;
    letter-spacing:-0.015em; line-height:var(--lh-tight);
  }
  .section-head .desc{font-size:var(--fs-meta); color:var(--text-muted); max-width:420px; text-align:right; line-height:1.35;}

  .funnel{display:flex; flex-direction:column; gap:10px;}
  .funnel-row{display:flex; align-items:center; gap:14px;}
  .funnel-label{width:150px; font-size:var(--fs-meta); font-weight:600; color:var(--text-secondary); flex-shrink:0;}
  .funnel-track{flex:1; height:34px; background:var(--surface-2); border-radius:8px; overflow:hidden;}
  .funnel-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), #7C93FF);
    display:flex; align-items:center; justify-content:flex-end; padding-right:12px;
    border-radius:8px; transition:width .6s ease;
  }
  .funnel-fill span{font-family:var(--font-mono); font-size:13px; font-weight:600; color:#fff;}
  .funnel-drop{width:80px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-muted); flex-shrink:0;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  .three-col{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}

  .table-controls{display:flex; gap:10px; margin-bottom:14px;}
  .table-controls input{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-size:13px; padding:8px 12px;}
  .table-controls input:focus{outline:none; border-color:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); font-weight:500; padding:0 10px 10px; cursor:pointer; white-space:nowrap;}
  thead th:hover{color:var(--text-secondary);}
  tbody td{padding:11px 10px; border-top:1px solid var(--border-soft); font-family:var(--font-mono); white-space:nowrap;}
  tbody td:first-child{font-family:var(--font-body); font-weight:500;}
  tbody tr{cursor:pointer; transition:background .1s;}
  tbody tr:hover{background:var(--accent-soft);}
  .badge{font-size:11px; padding:2px 8px; border-radius:100px; font-family:var(--font-body); font-weight:500; white-space:nowrap;}
  .badge.success{background:var(--success-soft); color:var(--success);}
  .badge.warning{background:var(--warning-soft); color:var(--warning);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .badge.neutral{background:var(--surface-3); color:var(--text-secondary);}

  .placeholder{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--text-muted); text-align:center; gap:10px;}
  .placeholder .big{font-size:15px; color:var(--text-secondary);}

  /* ---- detail panel ---- */
  #detailOverlay{
    display:none; position:fixed; inset:0; background:rgba(20,24,34,.35); z-index:50;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
  }
  #detailOverlay.open{display:flex;}
  #detailPanel{
    background:var(--surface); border-radius:16px; max-width:820px; width:100%;
    padding:28px 30px; box-shadow:0 20px 60px rgba(20,24,34,.2); animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(12px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;}
  .detail-head h2{font-family:var(--font-display); font-size:20px; font-weight:600;}
  .detail-head .close-btn{background:var(--surface-2); border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:16px; color:var(--text-secondary);}
  .detail-head .close-btn:hover{background:var(--surface-3);}
  .mini-kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  .mini-kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .detail-actions{display:flex; gap:8px; align-items:center;}
  .mini-kpi{background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .mini-kpi .label{font-size:var(--fs-overline); font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted);}
  .mini-kpi .value{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:4px; letter-spacing:-0.02em;}
  .compare-row{display:flex; align-items:center; gap:8px; font-size:var(--fs-meta); font-weight:600; margin-top:4px;}
  .compare-row.up{color:var(--success);} .compare-row.down{color:var(--danger);}
  .detail-head h2{font-size:22px; font-weight:700; letter-spacing:-0.02em;}

  /* ---- month cards ---- */
  .month-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .month-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px;
    cursor:pointer; transition:box-shadow .15s, border-color .15s; box-shadow:var(--shadow);
  }
  .month-card:hover{border-color:var(--accent); box-shadow:0 4px 14px rgba(68,87,232,.12);}
  .month-card h3{font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:10px;}
  .month-card .row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:4px;}
  .month-card .row b{color:var(--text-primary); font-family:var(--font-mono);}

  .toolbar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow);
  }
  .toolbar-left, .toolbar-right{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .toolbar select{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text-primary); font-size:13px; padding:8px 12px; min-width:180px;
  }
  .toolbar select:focus{outline:none; border-color:var(--accent);}
  .legend-bar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; font-size:var(--fs-meta); color:var(--text-secondary);}
  .kpi-card .delta.up, .kpi-card .delta.up .delta-main{color:var(--success);}
  .kpi-card .delta.down, .kpi-card .delta.down .delta-main{color:var(--danger);}
  .kpi-card .delta.flat, .kpi-card .delta.flat .delta-main{color:var(--text-muted);}
  .dropout-table{width:100%; border-collapse:collapse; font-size:var(--fs-meta);}
  .dropout-table th{
    text-align:left; font-size:var(--fs-overline); text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); font-weight:700; padding:0 10px 10px;
  }
  .dropout-table td{padding:10px; border-top:1px solid var(--border-soft); font-family:var(--font-mono);}
  .dropout-table td:first-child{font-family:var(--font-body); font-weight:600; color:var(--text-primary);}
  .footnote{margin-top:10px; font-size:var(--fs-meta); color:var(--text-muted); line-height:1.4;}
  .rank-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:var(--fs-body); padding:9px 0; border-top:1px solid var(--border-soft);
  }
  .rank-row .name{font-weight:600;}
  .toolbar label{font-size:var(--fs-meta); font-weight:600; color:var(--text-secondary);}
  #periodHint{font-size:var(--fs-meta); color:var(--text-muted); max-width:420px; line-height:1.35;}

  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .two-col, .three-col{grid-template-columns:1fr;}
    .mini-kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Контроль штата обучения</h1>
      <p>Воронка конверсии, отсев и результаты по тренерам и месяцам</p>
    </div>
    <div class="status-block">
      <div class="status-pill">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Не подключено</span>
      </div>
      <div class="data-updated" id="dataUpdatedLabel">Данные API: —</div>
      <div class="status-actions">
        <button class="btn" id="exportCsvBtn" type="button" style="display:none;">Экспорт CSV</button>
        <button class="btn" id="refreshBtn" type="button">Обновить</button>
      </div>
    </div>
  </header>

  <div id="config">
    <label for="urlInput">Ссылка на веб-сервис (Apps Script /exec)</label>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="btn primary" id="connectBtn">Подключить</button>
    <div class="hint">Впиши ссылку и нажми «Подключить». Автообновление — раз в сутки, в 08:00 по Москве.</div>
    <div class="hint" id="nextRefreshLabel"></div>
  </div>

  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab-btn active" data-tab="overview">Обзор</button>
    <button class="tab-btn" data-tab="trainers">По тренерам</button>
    <button class="tab-btn" data-tab="months">По месяцам</button>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="toolbar-left">
      <label for="periodSelect">Период</label>
      <select id="periodSelect" aria-label="Фильтр по месяцу">
        <option value="">Все месяцы</option>
      </select>
      <span id="periodHint" style="font-size:12px;color:var(--text-muted);"></span>
    </div>
    <div class="toolbar-right legend-bar" id="badgeLegend"></div>
  </div>

  <div id="content">
    <div class="placeholder">
      <div class="big">Загрузка данных…</div>
      <div>Идёт запрос к веб-сервису Apps Script. Если долго не отвечает — нажми «Обновить».</div>
    </div>
  </div>
</div>

<div id="detailOverlay">
  <div id="detailPanel"></div>
</div>

<script>
const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCpZCfhcuynPp0431uiLZactRUvv51as0hdNfTtkHKF69eN1SD_7aBfqNjs7MKzbt9Fw/exec';
const LOCAL_CACHE_KEY = 'trainingDashboard:lastPayload:v4';

let dashboardData = null;
let viewData = null;
let periodMonth = '';
let refreshTimeout = null, refreshInterval = null;
let trainerSortState = { key: 'rank', dir: 'asc' };
let tabsInited = false;
let pendingDeepLink = null;
let deepLinkApplied = false;
const DAY_MS = 24*60*60*1000;
const el = (id) => document.getElementById(id);
let charts = {};

const DEFAULT_METRICS = {
  badgeLow: 20, badgeHigh: 30, planConv1to5: 30,
  rankScore: 'tqi_v3',
  rankMinGroups: 2, rankMinDay1: 10, rankMinLineScores: 2,
  rankWeights: {
    quality: 0.40, line: 0.05, skills: 0.05, reliability: 0.15, contribution: 0.20, yield: 0.10, stability: 0.05
  },
  qualityMix: { conv1to5: 0.60, conv2: 0.25, conv3: 0.15 },
  contribFullAtShare: 0.25,
  reliabilityRefDay1: 200
};

function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function metrics(){ return Object.assign({}, DEFAULT_METRICS, (dashboardData && dashboardData.metrics) || {}); }
function round1(n){ return Math.round(n * 10) / 10; }
function pct(part, whole){ return whole ? round1((part/whole)*100) : 0; }
function groupCompleted(g){
  if(!g) return false;
  if(g.completed === false) return false;
  if(g.completed === true) return true;
  return true;
}
function outcomeGroupsOf(groups){ return (groups||[]).filter(groupCompleted); }
function outcomeGroupCount(t){
  if(t && t.groupsCompleted != null) return Number(t.groupsCompleted) || 0;
  return Number(t && t.groups) || 0;
}
function groupsInProgressCount(t){
  if(t && t.groupsInProgress != null) return Number(t.groupsInProgress) || 0;
  return Math.max(0, (Number(t && t.groups) || 0) - outcomeGroupCount(t));
}
function groupStatusBadge(g){
  if(g && g.fellApart) return '<span class="badge neutral">распалась</span>';
  if(!groupCompleted(g)) return '<span class="badge warning">в обучении</span>';
  return '<span class="badge success">ok</span>';
}
function sumField(rows, key){ return rows.reduce((s,r)=>s+(Number(r[key])||0), 0); }

function getNextRefreshTime(){
  const now = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 5,0,0));
  if(next.getTime() <= now.getTime()) next.setUTCDate(next.getUTCDate()+1);
  return next;
}
function updateNextRefreshLabel(nextDate){
  const label = el('nextRefreshLabel'); if(!label) return;
  label.textContent = 'Следующее автообновление: ' + nextDate.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit', timeZone:'Europe/Moscow'}) + ' МСК';
}
function startAutoRefresh(url){
  if(refreshTimeout) clearTimeout(refreshTimeout);
  if(refreshInterval) clearInterval(refreshInterval);
  const next = getNextRefreshTime();
  updateNextRefreshLabel(next);
  refreshTimeout = setTimeout(() => {
    fetchData(url, { forceRefresh: true, background: true });
    updateNextRefreshLabel(getNextRefreshTime());
    refreshInterval = setInterval(() => {
      fetchData(url, { forceRefresh: true, background: true });
      updateNextRefreshLabel(getNextRefreshTime());
    }, DAY_MS);
  }, next.getTime() - Date.now());
}

function setStatus(state, text){
  const dot = el('statusDot');
  dot.className = 'dot' + (state==='live' ? ' live' : state==='error' ? ' error' : '');
  el('statusText').textContent = text;
}

function pctBadgeClass(value){
  const m = metrics();
  if(value===null||value===undefined) return '';
  if(value>=m.badgeHigh) return 'success';
  if(value>=m.badgeLow) return 'warning';
  return 'danger';
}

function lineReviewMeta(){
  const m = (metrics() && metrics().lineReview) || {};
  return {
    badgeLow: m.badgeLow!=null ? m.badgeLow : 3.5,
    badgeHigh: m.badgeHigh!=null ? m.badgeHigh : 4.5,
    ok: m.ok,
    error: m.error || null
  };
}

function score15BadgeClass(value){
  const m = lineReviewMeta();
  if(value===null||value===undefined) return '';
  if(value>=m.badgeHigh) return 'success';
  if(value>=m.badgeLow) return 'warning';
  return 'danger';
}

function lineReviewOf(t){
  return t && t.lineReview ? t.lineReview : null;
}

function attachLineReviewFromRaw(trainers, raw){
  const map = {};
  (raw && raw.byTrainer || []).forEach(t=>{
    if(t && t.name && t.lineReview) map[t.name] = t.lineReview;
  });
  return (trainers||[]).map(t=>Object.assign({}, t, {
    lineReview: t.lineReview || map[t.name] || null
  }));
}

function hasLineReviewPayload(data){
  const src = data || dashboardData;
  if(!src) return false;
  if(src.schemaVersion>=6) return true;
  return !!(src.totals && src.totals.lineReview);
}

function clamp100(n){ return Math.max(0, Math.min(100, n)); }

function scoreContextFromTotals(totals){
  return {
    totalFinal: totals && totals.finalCount != null ? totals.finalCount : 0,
    totalGroups: totals && totals.groupsCompleted != null ? totals.groupsCompleted
      : (totals && totals.groups != null ? totals.groups : 0),
    totalDay1: totals && totals.day1 != null ? totals.day1 : 0,
    lineAvgScore: totals && totals.lineReview && totals.lineReview.avgScore != null
      ? totals.lineReview.avgScore : null,
    skillsAvgRate: (function(){
      const lr = totals && totals.lineReview;
      if(!lr) return null;
      const xs = [lr.scriptYesRate, lr.objectionsYesRate, lr.crmYesRate].filter(v=>v!=null);
      if(!xs.length) return null;
      return round1(xs.reduce((s,v)=>s+Number(v),0)/xs.length);
    })()
  };
}

/** TQI v3 — воронка + линия + вклад (как в GAS / ADR-016). */
function computeTrainerScore(t, mtr, ctx){
  const c15 = t.conv1to5Weighted!=null ? t.conv1to5Weighted : t.conv1to5;
  if(c15==null) return null;
  const m = Object.assign({}, DEFAULT_METRICS, mtr || metrics());
  const apiW = m.rankWeights || {};
  const w = Object.assign({ line: 0, skills: 0 }, apiW.quality!=null ? apiW : DEFAULT_METRICS.rankWeights);
  const qm = Object.assign({}, DEFAULT_METRICS.qualityMix, m.qualityMix || {});
  const c2 = t.conv2!=null ? t.conv2 : c15;
  const c3 = t.conv3!=null ? t.conv3 : c15;
  const quality = clamp100((qm.conv1to5||0)*c15 + (qm.conv2||0)*c2 + (qm.conv3||0)*c3);
  const ref = m.reliabilityRefDay1 || 200;
  const reliability = clamp100(Math.log((t.day1||0)+1) / Math.log(ref+1) * 100);
  const totalFinal = ctx && ctx.totalFinal ? ctx.totalFinal : 0;
  const share = totalFinal>0 ? (t.finalCount||0)/totalFinal : 0;
  const fullAt = m.contribFullAtShare || 0.25;
  const contribution = fullAt>0 ? clamp100(share/fullAt*100) : 0;
  const totalGroups = ctx && ctx.totalGroups ? ctx.totalGroups : 0;
  const avgYield = totalGroups>0 ? totalFinal/totalGroups : 0;
  const groupsOutcome = outcomeGroupCount(t);
  const yieldG = groupsOutcome>0 ? (t.finalCount||0)/groupsOutcome : 0;
  const yieldScore = avgYield>0 ? clamp100((yieldG/avgYield)*50) : 50;
  const fellShare = groupsOutcome>0 ? (t.fellApart||0)/groupsOutcome*100 : 0;
  const stability = clamp100(100-fellShare);
  const minN = m.rankMinLineScores!=null ? m.rankMinLineScores : 2;
  const lr = t.lineReview;
  const personal = !!(lr && lr.avgScore!=null && (Number(lr.scored)||0) >= minN);
  const lineRaw = personal ? lr.avgScore : (ctx && ctx.lineAvgScore!=null ? ctx.lineAvgScore : null);
  const lineFill = personal ? 'personal' : (lineRaw!=null ? 'company' : 'neutral');
  const line = lineRaw!=null ? clamp100(lineRaw/5*100) : 60;
  const skillsXs = lr ? [lr.scriptYesRate, lr.objectionsYesRate, lr.crmYesRate].filter(v=>v!=null) : [];
  const skillsFilled = lr ? (Number(lr.scriptFilled)||0)+(Number(lr.objectionsFilled)||0)+(Number(lr.crmFilled)||0) : 0;
  const skillsPersonal = skillsXs.length>0 && skillsFilled>=minN;
  const skillsRaw = skillsPersonal ? round1(skillsXs.reduce((s,v)=>s+Number(v),0)/skillsXs.length)
    : (ctx && ctx.skillsAvgRate!=null ? ctx.skillsAvgRate : null);
  const skillsFill = skillsPersonal ? 'personal' : (skillsRaw!=null ? 'company' : 'neutral');
  const skills = skillsRaw!=null ? clamp100(skillsRaw) : 80;
  const lineW = w.line!=null ? w.line : 0;
  const skillsW = w.skills!=null ? w.skills : 0;
  const score =
    (w.quality||0)*quality +
    lineW*line +
    skillsW*skills +
    (w.reliability||0)*reliability +
    (w.contribution||0)*contribution +
    (w.yield||0)*yieldScore +
    (w.stability||0)*stability;
  return {
    score: round1(score),
    parts: {
      quality: round1(quality),
      line: round1(line),
      lineFill,
      skills: round1(skills),
      skillsFill,
      reliability: round1(reliability),
      contribution: round1(contribution),
      yield: round1(yieldScore),
      stability: round1(stability)
    }
  };
}

function enrichTrainer(t, ctx){
  const day1 = t.day1||0;
  const groupsOutcome = outcomeGroupCount(t);
  const scored = computeTrainerScore(t, metrics(), ctx);
  return Object.assign({}, t, {
    leftRate: t.leftRate!=null ? t.leftRate : (day1>0 ? round1((t.leftSelf||0)/day1*100) : null),
    refuseRate: t.refuseRate!=null ? t.refuseRate : (day1>0 ? round1((t.refused||0)/day1*100) : null),
    transferRate: t.transferRate!=null ? t.transferRate : (day1>0 ? round1((t.transferred||0)/day1*100) : null),
    fellShare: t.fellShare!=null ? t.fellShare : (groupsOutcome>0 ? round1((t.fellApart||0)/groupsOutcome*100) : 0),
    yieldPerGroup: t.yieldPerGroup!=null ? t.yieldPerGroup : (groupsOutcome>0 ? round1((t.finalCount||0)/groupsOutcome) : null),
    contributionShare: t.contributionShare!=null ? t.contributionShare
      : (ctx && ctx.totalFinal>0 ? round1((t.finalCount||0)/ctx.totalFinal*100) : 0),
    score: scored ? scored.score : null,
    scoreParts: scored ? scored.parts : null
  });
}

function withTrainerScore(t, ctx){
  const baseCtx = ctx || scoreContextFromTotals((viewData && viewData.totals) || (dashboardData && dashboardData.totals) || {});
  return enrichTrainer(t, baseCtx);
}

function trainerRankEligible(t){
  const m = metrics();
  const minG = m.rankMinGroups!=null ? m.rankMinGroups : 2;
  const minD = m.rankMinDay1!=null ? m.rankMinDay1 : 10;
  return t.score!=null && outcomeGroupCount(t)>=minG && (t.day1||0)>=minD;
}

function rankedTrainers(list, totals){
  const ctx = scoreContextFromTotals(totals || {});
  const enriched = (list||[]).map(t=>enrichTrainer(t, ctx));
  const eligible = enriched.filter(trainerRankEligible)
    .sort((a,b)=> b.score!==a.score ? b.score-a.score : (b.finalCount||0)-(a.finalCount||0));
  const rankByName = {};
  eligible.forEach((t,i)=>{ rankByName[t.name]=i+1; });
  return enriched.map(t=>Object.assign({}, t, {
    rank: rankByName[t.name]!=null ? rankByName[t.name] : null,
    rankEligible: !!rankByName[t.name]
  })).sort((a,b)=>{
    if(a.rank!=null && b.rank!=null) return a.rank-b.rank;
    if(a.rank!=null) return -1;
    if(b.rank!=null) return 1;
    return (b.score||0)-(a.score||0);
  });
}

function companyInsights(data){
  const t = data.totals || {};
  const m = metrics();
  const trainers = rankedTrainers(data.byTrainer, t);
  const eligible = trainers.filter(x=>x.rankEligible);
  const leftRate = t.leftSelfRate!=null ? t.leftSelfRate : pct(t.leftSelf, t.day1);
  const refuseRate = t.refuseRate!=null ? t.refuseRate : pct(t.refused, t.day1);
  const transferRate = t.transferRate!=null ? t.transferRate : pct(t.transferred, t.day1);
  const yieldPerGroup = t.yieldPerGroup!=null ? t.yieldPerGroup
    : (outcomeGroupCount(t) ? round1(t.finalCount/outcomeGroupCount(t)) : 0);
  const belowPlan = eligible.filter(x=>trainerConv(x)!=null && trainerConv(x)<m.planConv1to5);
  const abovePlan = eligible.filter(x=>trainerConv(x)!=null && trainerConv(x)>=m.planConv1to5);
  const highLeft = eligible.filter(x=>(x.leftRate||0) >= Math.max(leftRate, 60));
  const highFell = eligible.filter(x=>(x.fellShare||0) >= 15);
  const topYield = [...eligible].sort((a,b)=>(b.yieldPerGroup||0)-(a.yieldPerGroup||0))[0];
  const topContrib = [...eligible].sort((a,b)=>(b.finalCount||0)-(a.finalCount||0))[0];
  const strengths = [];
  const weaknesses = [];
  if(t.conv1to5!=null && t.conv1to5>=m.planConv1to5) strengths.push(`Конверсия компании ${t.conv1to5}% ≥ плана ${m.planConv1to5}%`);
  else weaknesses.push(`Конверсия компании ${t.conv1to5}% ниже плана ${m.planConv1to5}%`);
  if(leftRate<=55) strengths.push(`Отсев «ушли сами» ${leftRate}% — в рабочем диапазоне`);
  else weaknesses.push(`Высокий отсев «ушли сами»: ${leftRate}% от day1`);
  if((t.fellApartShare||0)<=8) strengths.push(`Распад групп ${t.fellApartShare||0}% — под контролем`);
  else weaknesses.push(`Доля распавшихся групп ${t.fellApartShare||0}% — зона риска`);
  if(abovePlan.length) strengths.push(`${abovePlan.length} тренер(ов) на/выше плана 1→5`);
  if(belowPlan.length) weaknesses.push(`${belowPlan.length} тренер(ов) ниже плана 1→5`);
  if(highFell.length) weaknesses.push(`Высокий распад у: ${highFell.slice(0,3).map(x=>x.name).join(', ')}`);
  if(topContrib) strengths.push(`Главный вклад в выход: ${topContrib.name} (${topContrib.day1}→${topContrib.finalCount})`);
  if(topYield) strengths.push(`Лучший выход/группу: ${topYield.name} (${topYield.yieldPerGroup})`);
  if(highLeft.length>=3) weaknesses.push(`Слабое удержание у ${highLeft.length} тренеров (ушли ≥${Math.max(leftRate,60)}%)`);
  return { leftRate, refuseRate, transferRate, yieldPerGroup, trainers, eligible, belowPlan, abovePlan, strengths, weaknesses, topContrib, topYield };
}

function aggregateFromGroups(groups, raw){
  const completed = outcomeGroupsOf(groups);
  const groupsInProgress = Math.max(0, groups.length - completed.length);
  const day1 = sumField(completed,'day1');
  const day2Start = sumField(completed,'day2Start');
  const day3Start = sumField(completed,'day3Start');
  const leftSelf = sumField(completed,'leftSelf');
  const refused = sumField(completed,'refused');
  const transferred = sumField(completed,'transferred');
  const finalCount = sumField(completed,'finalCount');
  const fellGroups = completed.filter(g=>g.fellApart);
  const fellApart = fellGroups.length;
  const fellApartDay1 = sumField(fellGroups,'day1');
  const fellApartFinalCount = sumField(fellGroups,'finalCount');
  const fellApartConv1to5 = fellApartDay1>0 ? round1(fellApartFinalCount/fellApartDay1*100) : null;
  const fellApartShare = completed.length>0 ? round1(fellApart/completed.length*100) : 0;

  const byTrainerMap = {};
  groups.forEach(g=>{
    if(!byTrainerMap[g.trainer]){
      byTrainerMap[g.trainer] = {
        name:g.trainer, groups:0, groupsCompleted:0, groupsInProgress:0,
        fellApart:0, day1:0, leftSelf:0, refused:0, transferred:0, finalCount:0,
        fellApartDay1:0, fellApartFinal:0,
        conv1to5Sum:0, conv1to5Count:0, conv2Sum:0, conv2Count:0, conv3Sum:0, conv3Count:0
      };
    }
    const t = byTrainerMap[g.trainer];
    t.groups += 1;
    if(!groupCompleted(g)){ t.groupsInProgress += 1; return; }
    t.groupsCompleted += 1;
    if(g.fellApart){ t.fellApart += 1; t.fellApartDay1 += g.day1; t.fellApartFinal += g.finalCount; }
    t.day1 += g.day1; t.leftSelf += g.leftSelf; t.refused += g.refused;
    t.transferred += g.transferred; t.finalCount += g.finalCount;
    if(g.conv1to5!==null && g.conv1to5!==undefined){ t.conv1to5Sum += g.conv1to5; t.conv1to5Count += 1; }
    if(g.conv2!==null && g.conv2!==undefined){ t.conv2Sum += g.conv2; t.conv2Count += 1; }
    if(g.conv3!==null && g.conv3!==undefined){ t.conv3Sum += g.conv3; t.conv3Count += 1; }
  });
  const byTrainerRaw = Object.values(byTrainerMap).map(t=>({
    name:t.name, groups:t.groups, groupsCompleted:t.groupsCompleted, groupsInProgress:t.groupsInProgress,
    fellApart:t.fellApart, day1:t.day1, leftSelf:t.leftSelf, refused:t.refused,
    transferred:t.transferred, finalCount:t.finalCount,
    conv1to5: t.groupsCompleted>0 ? round1(t.conv1to5Sum/t.groupsCompleted) : null,
    conv1to5Weighted: t.day1>0 ? round1(t.finalCount/t.day1*100) : null,
    fellApartConv1to5: t.fellApartDay1>0 ? round1(t.fellApartFinal/t.fellApartDay1*100) : null,
    conv2: t.conv2Count>0 ? round1(t.conv2Sum/t.conv2Count) : null,
    conv3: t.conv3Count>0 ? round1(t.conv3Sum/t.conv3Count) : null
  }));
  const byTrainerWithReview = attachLineReviewFromRaw(byTrainerRaw, raw);

  const monthOrder = [];
  const byMonthMap = {};
  groups.forEach(g=>{
    if(!byMonthMap[g.month]){
      byMonthMap[g.month] = {
        month:g.month, groups:0, groupsCompleted:0, groupsInProgress:0, fellApart:0,
        day1:0, finalCount:0, leftSelf:0, refused:0, transferred:0, fellApartDay1:0, fellApartFinal:0
      };
      monthOrder.push(g.month);
    }
    const m = byMonthMap[g.month];
    m.groups += 1;
    if(!groupCompleted(g)){ m.groupsInProgress += 1; return; }
    m.groupsCompleted += 1;
    m.day1 += g.day1; m.finalCount += g.finalCount;
    if(g.fellApart){ m.fellApart += 1; m.fellApartDay1 += g.day1; m.fellApartFinal += g.finalCount; }
    m.leftSelf += g.leftSelf; m.refused += g.refused; m.transferred += g.transferred;
  });
  const byMonth = monthOrder.map(key=>{
    const m = byMonthMap[key];
    return {
      ...m,
      conv1to5: m.day1>0 ? round1(m.finalCount/m.day1*100) : null,
      fellApartConv1to5: m.fellApartDay1>0 ? round1(m.fellApartFinal/m.fellApartDay1*100) : null
    };
  });

  const totals = {
    groups: groups.length,
    groupsCompleted: completed.length,
    groupsInProgress,
    notGathered: null,
    fellApart,
    fellApartDay1,
    fellApartFinalCount,
    fellApartConv1to5,
    fellApartShare,
    day1, day2Start, day3Start, leftSelf, refused, transferred, finalCount,
    conv1to5: day1>0 ? round1(finalCount/day1*100) : 0,
    leftSelfRate: day1>0 ? round1(leftSelf/day1*100) : 0,
    refuseRate: day1>0 ? round1(refused/day1*100) : 0,
    transferRate: day1>0 ? round1(transferred/day1*100) : 0,
    yieldPerGroup: completed.length>0 ? round1(finalCount/completed.length) : 0,
    avgDay1PerGroup: completed.length>0 ? round1(day1/completed.length) : 0,
    lineReview: raw && raw.totals && raw.totals.lineReview ? raw.totals.lineReview : null
  };

  return {
    schemaVersion: raw.schemaVersion,
    updatedAt: raw.updatedAt,
    metrics: raw.metrics,
    periodFiltered: true,
    totals,
    funnel: [
      {label:'1-й день', value: day1},
      {label:'2-й день', value: day2Start},
      {label:'3-й день', value: day3Start},
      {label:'Выход на линию', value: finalCount}
    ],
    byTrainer: rankedTrainers(byTrainerWithReview, totals),
    byMonth,
    groups,
    allByMonth: raw.byMonth || []
  };
}

function buildViewData(raw, month){
  if(!month){
    const totals = Object.assign({}, raw.totals || {}, {
      leftSelfRate: raw.totals && raw.totals.leftSelfRate!=null ? raw.totals.leftSelfRate
        : pct(raw.totals && raw.totals.leftSelf, raw.totals && raw.totals.day1),
      refuseRate: raw.totals && raw.totals.refuseRate!=null ? raw.totals.refuseRate
        : pct(raw.totals && raw.totals.refused, raw.totals && raw.totals.day1),
      transferRate: raw.totals && raw.totals.transferRate!=null ? raw.totals.transferRate
        : pct(raw.totals && raw.totals.transferred, raw.totals && raw.totals.day1),
      yieldPerGroup: raw.totals && raw.totals.yieldPerGroup!=null ? raw.totals.yieldPerGroup
        : (raw.totals && outcomeGroupCount(raw.totals) ? round1(raw.totals.finalCount/outcomeGroupCount(raw.totals)) : 0)
    });
    const byTrainerBase = (raw.byTrainer||[]).map(t=>({
      ...t,
      fellApart: t.fellApart!=null ? t.fellApart : 0,
      conv1to5Weighted: t.conv1to5Weighted!=null ? t.conv1to5Weighted
        : (t.day1>0 ? round1(t.finalCount/t.day1*100) : null)
    }));
    return Object.assign({}, raw, {
      periodFiltered: false,
      allByMonth: raw.byMonth || [],
      totals,
      byTrainer: rankedTrainers(byTrainerBase, totals),
      byMonth: (raw.byMonth||[]).map(m=>({
        ...m,
        day1: m.day1!=null ? m.day1 : null,
        fellApart: m.fellApart!=null ? m.fellApart : 0,
        leftSelf: m.leftSelf!=null ? m.leftSelf : 0,
        refused: m.refused!=null ? m.refused : 0,
        transferred: m.transferred!=null ? m.transferred : 0,
        finalCount: m.finalCount!=null ? m.finalCount : null
      }))
    });
  }
  const groups = (raw.groups||[]).filter(g=>g.month===month);
  return aggregateFromGroups(groups, raw);
}

function momContext(raw, month){
  const months = raw.byMonth || [];
  if(!months.length) return null;
  let idx;
  if(month){
    idx = months.findIndex(m=>m.month===month);
  } else {
    idx = months.length - 1;
  }
  if(idx < 0) return null;
  const current = months[idx];
  const prev = idx > 0 ? months[idx-1] : null;
  return { current, prev, label: prev ? `к ${prev.month}` : null };
}

function deltaHtml(current, previous, opts={}){
  if(previous==null || current==null || Number.isNaN(current) || Number.isNaN(previous)){
    return `<div class="delta flat"><span class="delta-main">нет сравнения</span><span class="delta-note">${opts.note || 'нужен предыдущий месяц'}</span></div>`;
  }
  const diff = round1(current - previous);
  const invert = !!opts.invert;
  const good = invert ? diff <= 0 : diff >= 0;
  const cls = diff === 0 ? 'flat' : (good ? 'up' : 'down');
  const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '•';
  const unit = opts.unit || '';
  const note = opts.note || opts.label || '';
  return `<div class="delta ${cls}"><span class="delta-main">${arrow} ${diff>0?'+':''}${diff}${unit}</span>${note?`<span class="delta-note">${note}</span>`:''}</div>`;
}

function periodScopeLabel(filtered){

}

function periodContext(data){
  const months = dashboardData.byMonth || [];
  const last = months[months.length-1];
  const prev = months.length>1 ? months[months.length-2] : null;
  if(data.periodFiltered){
    return {
      eyebrow: 'Область данных',
      headline: `Статистика за месяц «${periodMonth}»`,
        support: 'Крупные цифры ниже — valid-группы выбранного месяца. «Всего групп» включает ещё идущие; выход, воронка и конверсии — только законченные (дата в D уже наступила или «распалась»). Стрелки сравнивают этот месяц с предыдущим.',
      side: prev ? `Сравнение: ${periodMonth} → к ${prev.month}` : 'Предыдущего месяца для сравнения нет',
      scope: 'Этот месяц',
      deltaNote: prev ? `к прошлому месяцу (${prev.month})` : 'нет прошлого месяца'
    };
  }
  return {
    eyebrow: 'Область данных',
    headline: 'Статистика за весь период',
    support: 'Крупные цифры: «Всего групп» — все старты. Выход, воронка, отсев и конверсии — только законченные группы (D ≤ сегодня или «распалась»). Стрелки ниже — не ко всей сумме, а изменение последнего месяца к предыдущему.',
    side: last && prev ? `Стрелки: ${last.month} → к ${prev.month}` : (last ? `Последний месяц: ${last.month}` : 'Мало данных для сравнения'),
    scope: 'Весь период',
    deltaNote: last && prev ? `последний месяц (${last.month}) к ${prev.month}` : 'нет базы для сравнения месяцев'
  };
}

function fillPeriodSelect(raw){
  const select = el('periodSelect');

function syncUrl(extra={}){
  const p = new URLSearchParams();
  const period = extra.period !== undefined ? extra.period : periodMonth;
  const tabBtn = document.querySelector('.tab-btn.active');
  const tab = extra.tab !== undefined ? extra.tab : (tabBtn ? tabBtn.dataset.tab : '');
  if(period) p.set('period', period);
  if(tab && tab !== 'overview') p.set('tab', tab);
  if(extra.trainer) p.set('trainer', extra.trainer);
  if(extra.month) p.set('month', extra.month);
  const qs = p.toString();
  const next = qs ? `${location.pathname}?${qs}` : location.pathname;
  history.replaceState(null, '', next);
}

function formatDataUpdated(iso){
  if(!iso) return 'Данные API: —';
  try{
    const d = new Date(iso);
    if(Number.isNaN(d.getTime())) return 'Данные API: ' + iso;
    return 'Данные API: ' + d.toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }catch(_){
    return 'Данные API: ' + iso;
  }
}

function csvEscape(v){
  const s = v==null ? '' : String(v);
  if(/[;"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCsv(filename, rows){
  const body = rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+body], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function applyPendingDeepLink(){
  if(deepLinkApplied || !hasDeepLinkIntent(pendingDeepLink) || !dashboardData) return;
  const link = pendingDeepLink;
  deepLinkApplied = true;
  if(link.period){
    const exists = (dashboardData.byMonth||[]).some(m=>m.month===link.period);

  }
  viewData = buildViewData(dashboardData, periodMonth);
  fillPeriodSelect(dashboardData);

  renderTrainersTab(viewData);
  renderMonthsTab(viewData);
  const tab = link.tab || (link.trainer ? 'trainers' : link.month ? 'months' : 'overview');
  activateTab(tab);
  initTabsOnce();
  syncUrl({ period: periodMonth, tab, trainer: link.trainer || '', month: link.month || '' });

    const found = viewData.byTrainer.find(t=>t.name===link.trainer)
      || viewData.byTrainer.find(t=>t.name.toLowerCase()===link.trainer.toLowerCase());
    if(found) openTrainerDetail(found.name, {skipUrl:true});
  } else if(link.month){
    const exists = (dashboardData.byMonth||[]).some(m=>m.month===link.month);
    if(exists) openMonthDetail(link.month, {skipUrl:true});

function apiUrl(base, forceRefresh){
  const u = new URL(base, location.href);
  if(forceRefresh) u.searchParams.set('refresh', '1');
  else u.searchParams.delete('refresh');
  // анти-кэш браузера на сам запрос
  u.searchParams.set('_', String(Date.now()));
  return u.toString();
}

function loadLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !data.totals) return null;
    return data;
  }catch(_){
    return null;
  }
}

function saveLocalCache(data){
  try{
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data));
  }catch(_){
    // quota / private mode — игнорируем
  }
}

function showCachedThenRefresh(baseUrl){
  const cached = loadLocalCache();
  if(cached){
    dashboardData = cached;
    try{
      renderAll();
      setStatus('live', 'Кэш · обновляю…');
      el('dataUpdatedLabel').textContent = formatDataUpdated(cached.updatedAt) + ' · показан локальный кэш';
    }catch(err){
      console.error('cached render failed', err);
    }
  }
  return fetchData(baseUrl, { forceRefresh: false, background: !!cached });
}

async function fetchData(url, opts={}){
  const forceRefresh = !!opts.forceRefresh;
  const background = !!opts.background;
  if(!background){
    setStatus('', 'Загрузка...');
    el('dataUpdatedLabel').textContent = 'Данные API: загрузка…';
  }else{
    setStatus('live', 'Кэш · обновляю…');
  }
  try{
    const res = await fetch(apiUrl(url, forceRefresh), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(!data || !data.totals) throw new Error('Некорректный JSON API');
    dashboardData = data;
    saveLocalCache(data);
    try{
      renderAll();
    }catch(renderErr){
      console.error('renderAll failed', renderErr);
      throw new Error('Данные получены, но отрисовка упала: ' + (renderErr && renderErr.message ? renderErr.message : renderErr));
    }
    const cacheNote = data.cache && data.cache.hit ? ' · серверный кэш' : ' · свежий расчёт';
    setStatus('live', 'Обновлено в ' + new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
    el('dataUpdatedLabel').textContent = formatDataUpdated(data.updatedAt) + cacheNote;
  }catch(err){
    console.error('fetchData failed', err);
    if(dashboardData){
      setStatus('live', 'Кэш · нет сети/API');
      el('dataUpdatedLabel').textContent = formatDataUpdated(dashboardData.updatedAt) + ' · не удалось обновить';
      return;
    }
    setStatus('error', 'Ошибка подключения');
    el('dataUpdatedLabel').textContent = 'Данные API: ошибка';
    el('config').style.display = '';
    el('content').innerHTML = '<div class="placeholder"><div class="big">Не удалось получить данные</div><div>Проверь ссылку `/exec`, доступ веб-приложения и консоль браузера (F12).</div><div style="margin-top:8px;color:var(--text-muted);font-size:12px;">'+String(err && err.message ? err.message : err)+'</div></div>';
  }
}

function trainerConv(t){
  return t.conv1to5Weighted!=null ? t.conv1to5Weighted : t.conv1to5;
}

function trainerSkillsPct(t){
  return t && t.scoreParts && t.scoreParts.skills!=null ? t.scoreParts.skills : null;
}

function renderFunnelInto(elId, funnel){
  const max = (funnel[0] && funnel[0].value) || 1;
  let html = '';
  funnel.forEach((step,i)=>{
    const widthPct = Math.max(6, Math.round((step.value/max)*100));
    let dropText='';
    if(i>0){ const prev=funnel[i-1].value; const drop = prev>0 ? round1((1-step.value/prev)*100) : 0; dropText='−'+drop+'%'; }
    html += `<div class="funnel-row"><div class="funnel-label">${step.label}</div><div class="funnel-track"><div class="funnel-fill" style="width:${widthPct}%"><span>${step.value}</span></div></div><div class="funnel-drop">${dropText}</div></div>`;
  });
  el(elId).innerHTML = html;
}

function renderTrainerTable(data){
  let trainers = rankedTrainers(data.byTrainer, data.totals);
  const search = (el('trainerSearch') && el('trainerSearch').value.toLowerCase()) || '';
  if(search) trainers = trainers.filter(t=>t.name.toLowerCase().includes(search));
  trainers.sort((a,b)=>{
    const key = trainerSortState.key;
    let av, bv;
    if(key==='lineScore'){
      av = a.lineReview && a.lineReview.avgScore; bv = b.lineReview && b.lineReview.avgScore;
    } else if(key==='skillsScore'){
      av = trainerSkillsPct(a); bv = trainerSkillsPct(b);
    } else {
      av=a[key]; bv=b[key];
    }
    if(key==='rank'){
      av = av!=null ? av : 9999; bv = bv!=null ? bv : 9999;
    } else {
      if(av===null||av===undefined) av=-1; if(bv===null||bv===undefined) bv=-1;
    }
    if(typeof av==='string') return trainerSortState.dir==='asc'? av.localeCompare(bv,'ru'): bv.localeCompare(av,'ru');
    return trainerSortState.dir==='asc'? av-bv : bv-av;
  });
  const cols = [
    ['rank','#'],['name','Тренер'],['score','TQI v3'],['lineScore','ОС 1–5'],['skillsScore','Оценка кандидатов'],['groups','Групп'],['day1','Day1'],['finalCount','Итог'],
    ['yieldPerGroup','Выход/гр'],['contributionShare','Вклад %'],['fellApart','Распалось'],
    ['leftRate','Ушли %'],['conv1to5Weighted','Конв. 1→5'],['conv2','Конв. 2→5'],['conv3','Конв. 3→5']
  ];
  el('trainerHeadRow').innerHTML = cols.map(([key,label])=>{
    const arrow = trainerSortState.key===key ? (trainerSortState.dir==='asc'?' ↑':' ↓') : '';
    return `<th data-key="${key}">${label}${arrow}</th>`;
  }).join('');
  el('trainerBody').innerHTML = trainers.map(t=>`
    <tr data-trainer="${t.name}">
      <td><span class="badge ${t.rank!=null && t.rank<=3?'success':(t.rankEligible?'neutral':'')}">${t.rank!=null?t.rank:'—'}</span></td>
      <td>${t.name}</td>
      <td><span class="badge ${pctBadgeClass(t.score)}">${t.score!=null?t.score:'—'}</span></td>
      <td><span class="badge ${score15BadgeClass(t.lineReview && t.lineReview.avgScore)}">${t.lineReview && t.lineReview.avgScore!=null?t.lineReview.avgScore:'—'}</span></td>
      <td><span class="badge ${pctBadgeClass(trainerSkillsPct(t))}">${trainerSkillsPct(t)!=null?trainerSkillsPct(t)+'%':'—'}</span></td>
      <td>${t.groups}${groupsInProgressCount(t)?` <span style="color:var(--text-muted);font-size:11px;">/${outcomeGroupCount(t)}</span>`:''}</td><td>${t.day1}</td><td>${t.finalCount}</td>
      <td>${t.yieldPerGroup!=null?t.yieldPerGroup:'—'}</td>
      <td>${t.contributionShare!=null?t.contributionShare+'%':'—'}</td>
      <td>${t.fellApart||0}</td>
      <td>${t.leftRate!=null?t.leftRate+'%':'—'}</td>
      <td><span class="badge ${pctBadgeClass(t.conv1to5Weighted)}">${t.conv1to5Weighted!=null?t.conv1to5Weighted+'%':'—'}</span></td>
      <td>${t.conv2!=null?t.conv2+'%':'—'}</td><td>${t.conv3!=null?t.conv3+'%':'—'}</td>
    </tr>`).join('');
  document.querySelectorAll('#trainerHeadRow th').forEach(th=>th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(trainerSortState.key===key) trainerSortState.dir = trainerSortState.dir==='asc'?'desc':'asc';
    else { trainerSortState.key=key; trainerSortState.dir = key==='rank' ? 'asc' : 'desc'; }
    renderTrainerTable(viewData);
  }));
  document.querySelectorAll('#trainerBody tr').forEach(tr=>tr.addEventListener('click', ()=>openTrainerDetail(tr.dataset.trainer)));
}

function openTrainerDetail(name, opts={}){
  const data = viewData;
  const trainer = rankedTrainers(data.byTrainer, data.totals).find(t=>t.name===name)
    || withTrainerScore(data.byTrainer.find(t=>t.name===name) || {}, scoreContextFromTotals(data.totals));
  if(!trainer || !trainer.name) return;
  const groups = data.groups.filter(g=>g.trainer===name);
  const overallConv = data.totals.conv1to5;
  const tw = trainerConv(trainer);
  const diff = tw!==null ? round1(tw-overallConv) : null;
  const parts = trainer.scoreParts || {};

  const completed = outcomeGroupsOf(groups);
  const byMonth = {};
  groups.forEach(g=>{
    if(!byMonth[g.month]) byMonth[g.month] = {month:g.month, day1:0, finalCount:0, groups:0, leftSelf:0, refused:0, transferred:0};
    byMonth[g.month].groups += 1;
    if(!groupCompleted(g)) return;
    byMonth[g.month].day1 += g.day1; byMonth[g.month].finalCount += g.finalCount;
    byMonth[g.month].leftSelf += g.leftSelf; byMonth[g.month].refused += g.refused; byMonth[g.month].transferred += g.transferred;
  });
  const monthTrend = Object.values(byMonth).map(m=>({month:m.month, conv1to5: m.day1>0? round1(m.finalCount/m.day1*100) : null, ...m}));

  const funnel = [
    {label:'1-й день', value: completed.reduce((s,g)=>s+g.day1,0)},
    {label:'2-й день', value: completed.reduce((s,g)=>s+g.day2Start,0)},
    {label:'3-й день', value: completed.reduce((s,g)=>s+g.day3Start,0)},
    {label:'Выход на линию', value: completed.reduce((s,g)=>s+g.finalCount,0)}
  ];

  el('detailPanel').innerHTML = `
    <div class="detail-head">
      <h2>${name}</h2>
      <div class="detail-actions">
        <button class="btn" id="copyTrainerLink" type="button">Ссылка</button>
        <button class="close-btn" id="closeDetail" type="button">✕</button>
      </div>
    </div>
    <div class="mini-kpi-grid">
      <div class="mini-kpi"><div class="label">Место / TQI v3</div><div class="value">${trainer.rank!=null?trainer.rank:'—'} · ${trainer.score!=null?trainer.score:'—'}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${trainer.rankEligible?'в рейтинге':'мало данных для места'}</div>
      </div>
      <div class="mini-kpi"><div class="label">Day1 → итог</div><div class="value">${trainer.day1} → ${trainer.finalCount}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">вклад ${trainer.contributionShare!=null?trainer.contributionShare+'%':'—'} · ${trainer.yieldPerGroup!=null?trainer.yieldPerGroup:'—'}/гр</div>
      </div>
      <div class="mini-kpi"><div class="label">Конв. взвеш. 1→5</div><div class="value">${tw!=null?tw+'%':'—'}</div>
        ${diff!==null ? `<div class="compare-row ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff)}% к периоду</div>` : ''}
      </div>
      <div class="mini-kpi"><div class="label">Групп / распад / ушли</div><div class="value">${trainer.groups} / ${trainer.fellApart||0}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">закончились ${outcomeGroupCount(trainer)} · в обучении ${groupsInProgressCount(trainer)} · ушли ${trainer.leftRate!=null?trainer.leftRate+'%':'—'}</div>
      </div>
    </div>
    <div class="mini-kpi-grid cols-3" style="margin-top:-8px;">
      <div class="mini-kpi"><div class="label">Качество воронки</div><div class="value">${parts.quality!=null?parts.quality:'—'}</div></div>
      <div class="mini-kpi"><div class="label">Балл 1–5 (в TQI)</div><div class="value">${parts.line!=null?parts.line:'—'}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${parts.lineFill==='personal'?'своя средняя ≥2 оценок':(parts.lineFill==='company'?'подставлена средняя компании':'нет данных журнала')}</div>
      </div>
      <div class="mini-kpi"><div class="label">Оценка кандидатов (в TQI)</div><div class="value">${parts.skills!=null?parts.skills:'—'}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">скрипт / возражения / CRM · ${parts.skillsFill==='personal'?'своё среднее «да» ≥2 ответов':(parts.skillsFill==='company'?'подставлена средняя компании':'нет данных журнала')}</div>
      </div>
    </div>
    <div class="mini-kpi-grid cols-3" style="margin-top:-8px;">
      <div class="mini-kpi"><div class="label">Вклад / надёжность</div><div class="value">${parts.contribution!=null?parts.contribution:'—'} / ${parts.reliability!=null?parts.reliability:'—'}</div></div>
      <div class="mini-kpi"><div class="label">Yield / стабильность</div><div class="value">${parts.yield!=null?parts.yield:'—'} / ${parts.stability!=null?parts.stability:'—'}</div></div>
      <div class="mini-kpi"><div class="label">Отказали / перенесли</div><div class="value">${trainer.refused} / ${trainer.transferred}</div></div>
    </div>
    <div class="mini-kpi-grid cols-3" style="margin-top:-8px;">
      <div class="mini-kpi"><div class="label">Конв. 2→5</div><div class="value">${trainer.conv2!=null?trainer.conv2+'%':'—'}</div></div>
      <div class="mini-kpi"><div class="label">Конв. 3→5</div><div class="value">${trainer.conv3!=null?trainer.conv3+'%':'—'}</div></div>
    </div>
    ${renderTrainerLineReviewBlock(trainer)}
    <div class="footnote" style="margin:-2px 0 14px;">Область: ${periodMonth?`месяц «${periodMonth}»`:'весь период'}. Воронка и конверсии — законченные группы. Оценка после линии — весь журнал ОС. «В обучении» видны в списке, но не в цифрах результата.</div>
    <div class="section-head"><h2>Воронка тренера</h2></div>
    <div class="funnel" id="trainerFunnel" style="margin-bottom:22px;"></div>
    <div class="section-head"><h2>Группы тренера</h2></div>
    <table class="dropout-table" style="margin-bottom:18px;">
      <thead><tr><th>Группа</th><th>Старт</th><th>1-й день</th><th>Итог</th><th>Конв.</th><th>Статус</th></tr></thead>
      <tbody>
        ${groups.map(g=>`<tr>
          <td>${g.label||'—'}</td>
          <td>${g.startDate||'—'}</td>
          <td>${g.day1}</td>
          <td>${g.finalCount}</td>
          <td><span class="badge ${pctBadgeClass(g.conv1to5)}">${g.conv1to5!=null?g.conv1to5+'%':'—'}</span></td>
          <td>${groupStatusBadge(g)}</td>
        </tr>`).join('') || '<tr><td colspan="6" style="font-family:var(--font-body);color:var(--text-muted);">Нет групп</td></tr>'}
      </tbody>
    </table>
    <div class="section-head"><h2>Динамика и отсев по месяцам</h2></div>
    <div style="position:relative;height:180px;margin-bottom:12px;"><canvas id="trainerTrendChart"></canvas></div>
    <table class="dropout-table">
      <thead><tr><th>Месяц</th><th>Групп</th><th>1-й день</th><th>Итог</th><th>Ушли</th><th>Отказали</th><th>Перенесли</th><th>Конв.</th></tr></thead>
      <tbody>
        ${monthTrend.map(m=>`<tr>
          <td>${m.month}</td><td>${m.groups}</td><td>${m.day1}</td><td>${m.finalCount}</td><td>${m.leftSelf}</td><td>${m.refused}</td><td>${m.transferred}</td>
          <td><span class="badge ${pctBadgeClass(m.conv1to5)}">${m.conv1to5!=null?m.conv1to5+'%':'—'}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  renderFunnelInto('trainerFunnel', funnel);
  destroyChart('trainerTrendChart');
  const ctx = document.getElementById('trainerTrendChart');
  if(ctx && typeof Chart!=='undefined') charts['trainerTrendChart'] = new Chart(ctx, {
    type:'bar',
    data:{ labels: monthTrend.map(m=>m.month), datasets:[{ label:'Конверсия 1→5', data: monthTrend.map(m=>m.conv1to5), backgroundColor:'#4457E8', borderRadius:5 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ticks:{color:'#8E96A3', callback:v=>v+'%'}, grid:{color:'#EDEFF2'}}, x:{ticks:{color:'#8E96A3'}, grid:{display:false}} } }
  });
  el('detailOverlay').classList.add('open');
  el('closeDetail').addEventListener('click', closeDetail);
  el('copyTrainerLink').addEventListener('click', async ()=>{
    syncUrl({ trainer: name, tab: 'trainers', month: '' });
    try{
      await navigator.clipboard.writeText(location.href);
      el('copyTrainerLink').textContent = 'Скопировано';
      setTimeout(()=>{ if(el('copyTrainerLink')) el('copyTrainerLink').textContent = 'Ссылка'; }, 1500);
    }catch(_){
      prompt('Скопируй ссылку:', location.href);
    }
  });
  if(!opts.skipUrl) syncUrl({ trainer: name, tab: 'trainers', month: '' });
}

function closeDetail(){
  el('detailOverlay').classList.remove('open');
  destroyChart('trainerTrendChart');
  const tab = document.querySelector('.tab-btn.active')?.dataset.tab || 'overview';
  syncUrl({ tab, trainer: '', month: '' });
}
el('detailOverlay').addEventListener('click', (e)=>{ if(e.target.id==='detailOverlay') closeDetail(); });

function renderMonthsTab(data){
  const months = data.periodFiltered ? data.byMonth : (dashboardData.byMonth || []);
  let html = `<div id="panel-months" class="tab-panel">
    <div class="context-banner" style="margin-bottom:14px;">
      <div>
        <div class="eyebrow">Вкладка месяцев</div>
        <div class="headline">${data.periodFiltered ? `Карточки с фокусом на «${periodMonth}»` : 'Все месяцы обучения'}</div>
        <div class="support">Каждая карточка — статистика одного месяца. Клик открывает тренеров и воронку за этот месяц.</div>
      </div>
      <div class="side-note">Конверсия на карточке — взвешенная (final ÷ day1).</div>
    </div>
    <div class="section"><div class="section-head"><h2>Месяцы</h2><div class="desc">Сначала смотри конверсию и отсев, потом проваливайся в детали</div></div>
    <div class="month-grid" id="monthGrid"></div></div>
  </div>`;
  el('content').insertAdjacentHTML('beforeend', html);
  el('monthGrid').innerHTML = months.map(m=>`
    <div class="month-card" data-month="${m.month}">
      <h3>${m.month}</h3>
      <div class="row"><span>Групп</span><b>${m.groups}</b></div>
      <div class="row"><span>В обучении</span><b>${m.groupsInProgress!=null?m.groupsInProgress:0}</b></div>
      <div class="row"><span>Распалось</span><b>${m.fellApart!=null?m.fellApart:0}</b></div>
      <div class="row"><span>Конв. 1→5</span><b>${m.conv1to5!==null&&m.conv1to5!==undefined?m.conv1to5+'%':'—'}</b></div>
      <div class="row"><span>Ушли сами</span><b>${m.leftSelf!=null?m.leftSelf:'—'}</b></div>
      <div class="row"><span>Отказали</span><b>${m.refused!=null?m.refused:'—'}</b></div>
      <div class="row"><span>Перенесли</span><b>${m.transferred!=null?m.transferred:'—'}</b></div>
    </div>`).join('') || '<div style="color:var(--text-muted);font-size:13px;">Нет данных</div>';
  document.querySelectorAll('.month-card').forEach(c=>c.addEventListener('click', ()=>openMonthDetail(c.dataset.month)));
}

function openMonthDetail(month, opts={}){
  const sourceGroups = dashboardData.groups || [];
  const groups = sourceGroups.filter(g=>g.month===month);
  const completed = outcomeGroupsOf(groups);
  const day1 = completed.reduce((s,g)=>s+g.day1,0);
  const day2 = completed.reduce((s,g)=>s+g.day2Start,0);
  const day3 = completed.reduce((s,g)=>s+g.day3Start,0);
  const final = completed.reduce((s,g)=>s+g.finalCount,0);
  const leftSelf = completed.reduce((s,g)=>s+g.leftSelf,0);
  const refused = completed.reduce((s,g)=>s+g.refused,0);
  const transferred = completed.reduce((s,g)=>s+g.transferred,0);
  const conv = day1>0 ? round1(final/day1*100) : 0;
  const months = dashboardData.byMonth || [];
  const idx = months.findIndex(m=>m.month===month);
  const prev = idx>0 ? months[idx-1] : null;

  const byTrainer = {};
  groups.forEach(g=>{
    if(!byTrainer[g.trainer]) byTrainer[g.trainer] = {name:g.trainer, day1:0, finalCount:0, groups:0, leftSelf:0, refused:0, transferred:0};
    byTrainer[g.trainer].groups += 1;
    if(!groupCompleted(g)) return;
    byTrainer[g.trainer].day1 += g.day1; byTrainer[g.trainer].finalCount += g.finalCount;
    byTrainer[g.trainer].leftSelf += g.leftSelf; byTrainer[g.trainer].refused += g.refused; byTrainer[g.trainer].transferred += g.transferred;
  });
  const trainerRows = Object.values(byTrainer).map(t=>({...t, conv: t.day1>0? round1(t.finalCount/t.day1*100) : null}))
    .sort((a,b)=>(b.conv||0)-(a.conv||0));

  el('detailPanel').innerHTML = `
    <div class="detail-head">
      <h2>${month}</h2>
      <div class="detail-actions">
        <button class="btn" id="copyMonthLink" type="button">Ссылка</button>
        <button class="close-btn" id="closeDetail" type="button">✕</button>
      </div>
    </div>
    <div class="mini-kpi-grid">
      <div class="mini-kpi"><div class="label">Групп</div><div class="value">${groups.length}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">закончились ${completed.length} · в обучении ${groups.length-completed.length}</div>
        ${prev?`<div class="compare-row ${groups.length-prev.groups>=0?'up':'down'}">${groups.length-prev.groups>=0?'▲':'▼'} ${Math.abs(groups.length-prev.groups)} к ${prev.month}</div>`:''}
      </div>
      <div class="mini-kpi"><div class="label">Конв. 1→5</div><div class="value">${conv}%</div>
        ${prev&&prev.conv1to5!=null?`<div class="compare-row ${conv-prev.conv1to5>=0?'up':'down'}">${conv-prev.conv1to5>=0?'▲':'▼'} ${Math.abs(round1(conv-prev.conv1to5))}% к ${prev.month}</div>`:''}
      </div>
      <div class="mini-kpi"><div class="label">Ушли сами</div><div class="value">${leftSelf}</div></div>
      <div class="mini-kpi"><div class="label">Отказали / перенесли</div><div class="value">${refused} / ${transferred}</div></div>
    </div>
    <div class="section-head"><h2>Воронка месяца</h2></div>
    <div class="funnel" id="monthFunnel" style="margin-bottom:22px;"></div>
    <div class="section-head"><h2>Тренеры в этом месяце</h2></div>
    <div style="max-height:280px;overflow-y:auto;">
      <table class="dropout-table">
        <thead><tr><th>Тренер</th><th>Гр.</th><th>Ушли</th><th>Отказали</th><th>Перенесли</th><th>Конв.</th></tr></thead>
        <tbody>
          ${trainerRows.map(t=>`<tr>
            <td>${t.name}</td><td>${t.groups}</td><td>${t.leftSelf}</td><td>${t.refused}</td><td>${t.transferred}</td>
            <td><span class="badge ${pctBadgeClass(t.conv)}">${t.conv!=null?t.conv+'%':'—'}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  renderFunnelInto('monthFunnel', [
    {label:'1-й день', value: day1}, {label:'2-й день', value: day2}, {label:'3-й день', value: day3}, {label:'Выход на линию', value: final}
  ]);
  el('detailOverlay').classList.add('open');
  el('closeDetail').addEventListener('click', closeDetail);
  el('copyMonthLink').addEventListener('click', async ()=>{
    syncUrl({ month, tab: 'months', trainer: '' });
    try{
      await navigator.clipboard.writeText(location.href);
      el('copyMonthLink').textContent = 'Скопировано';
      setTimeout(()=>{ if(el('copyMonthLink')) el('copyMonthLink').textContent = 'Ссылка'; }, 1500);
    }catch(_){
      prompt('Скопируй ссылку:', location.href);
    }
  });
  if(!opts.skipUrl) syncUrl({ month, tab: 'months', trainer: '' });
}
</script>
</body>
</html>
